<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMATT Attendance System</title>
<style>
body{font-family:Arial;background:#f5f6fa;padding:15px}
.card{background:white;padding:20px;border-radius:12px;max-width:500px;margin:auto;box-shadow:0 2px 8px #ccc}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc}
button{background:#0a3d62;color:white;font-weight:bold;border:none}
.small{font-size:12px;color:gray}
.hidden{display:none}
.teacher-box{background:#e8f8f5;padding:10px;border-radius:8px;margin-bottom:15px}
#timer{color:red;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<div class="card">
<h2>IMATT Attendance - IMATT College</h2>

<div id="teacherLogin">
<h3>Teacher Login Only</h3>
<input type="password" id="teacherPass" placeholder="Teacher Password (imatt2026)">
<button onclick="teacherLogin()">Login</button>
</div>

<div id="teacherPanel" class="hidden">
<div class="teacher-box">
<p><b>Teacher Mode</b></p>
<p>Secret Code: <b id="todayCode" style="font-size:22px;color:red">Not Generated</b></p>
<p>Attendance Closes In: <span id="timer">--:--</span></p>
<button onclick="generateCode()">Generate Code & START 15 Min Class</button>
<p>Present: <b id="presentCount">0</b> | Total: <b id="totalCount">0</b></p>
<button onclick="exportExcel()">Download Excel</button>
<button onclick="teacherLogout()" style="background:gray">Logout</button>
</div>
</div>

<div id="studentForm" class="hidden">
<h3>Mark Attendance</h3>
<input type="text" id="stuID" placeholder="Student ID e.g. 1727">
<input type="text" id="stuName" placeholder="Full Name">
<select id="dept">
<option>Computer Science Year 2</option>
<option>Computer Science Year 1</option>
</select>
<input type="text" id="secretCodeInput" placeholder="Secret Code from Board">
<button id="markBtn" onclick="markAttendance()">Mark Present</button>
<p id="message"></p>
<p class="small">1 Phone = 1 Person. Attendance closes after 15 minutes.</p>
</div>

</div>

<script>
const TEACHER_PASSWORD = "imatt2026";
const CLASS_DURATION_MINUTES = 15; // <-- YOUR 15 MINUTES HERE

function teacherLogin(){
 if(document.getElementById('teacherPass').value === TEACHER_PASSWORD){
   localStorage.setItem('imatt_teacher_logged','yes');
   showPanels();
 } else { alert('Wrong Password!'); }
}
function teacherLogout(){ localStorage.removeItem('imatt_teacher_logged'); location.reload(); }

function showPanels(){
 if(localStorage.getItem('imatt_teacher_logged')==='yes'){
   document.getElementById('teacherLogin').classList.add('hidden');
   document.getElementById('teacherPanel').classList.remove('hidden');
   document.getElementById('studentForm').classList.remove('hidden');
   showCode(); loadCounts(); startTimer();
 }
}
function generateCode(){
 const code = 'IMATT-' + Math.random().toString(36).substring(2,6).toUpperCase();
 const expiry = Date.now() + CLASS_DURATION_MINUTES*60*1000;
 localStorage.setItem('imatt_today_code', code);
 localStorage.setItem('imatt_code_expiry', expiry);
 document.getElementById('todayCode').innerText = code;
 alert('WRITE ON BOARD: '+code+'\nAttendance will CLOSE in 15 minutes!');
 startTimer();
}
function showCode(){
 const c = localStorage.getItem('imatt_today_code');
 if(c) document.getElementById('todayCode').innerText = c;
}
function startTimer(){
 setInterval(()=>{
  const expiry = localStorage.getItem('imatt_code_expiry');
  if(!expiry) return;
  const diff = expiry - Date.now();
  if(diff <= 0){
    document.getElementById('timer').innerText = 'CLOSED';
    document.getElementById('markBtn').disabled = true;
    document.getElementById('markBtn').innerText = 'Attendance Closed';
    document.getElementById('markBtn').style.background='red';
    document.getElementById('message').innerText = '❌ Attendance closed after 15 minutes. Late students are Absent.';
  } else {
    let m = Math.floor(diff/60000); let s = Math.floor((diff%60000)/1000);
    document.getElementById('timer').innerText = m+':'+(s<10?'0':'')+s;
    document.getElementById('markBtn').disabled = false;
    document.getElementById('markBtn').innerText = 'Mark Present';
  }
 },1000);
}
function markAttendance(){
 const expiry = localStorage.getItem('imatt_code_expiry');
 if(!expiry || Date.now() > expiry){ alert('Attendance CLOSED after 15 minutes!'); return; }

 const id = document.getElementById('stuID').value.trim();
 const name = document.getElementById('stuName').value.trim();
 const dept = document.getElementById('dept').value;
 const enteredCode = document.getElementById('secretCodeInput').value.trim().toUpperCase();
 const realCode = localStorage.getItem('imatt_today_code');
 const today = new Date().toISOString().split('T')[0];

 if(!id||!name){ alert('Enter ID and Name'); return; }
 if(enteredCode!==realCode){ alert('Wrong Secret Code! Must be in class.'); return; }

 const phoneUsed = localStorage.getItem('imatt_phone_used_'+today);
 if(phoneUsed){ document.getElementById('message').innerText = '❌ This phone already used for '+phoneUsed; return; }

 let records = JSON.parse(localStorage.getItem('attendanceRecords') || '{}');
 if(!records[today]) records[today] = {};
 if(records[today][id]){ document.getElementById('message').innerText='❌ ID '+id+' already marked!'; return; }

 records[today][id] = {name:name, dept:dept, status:'Present', time:new Date().toLocaleTimeString()};
 localStorage.setItem('attendanceRecords', JSON.stringify(records));
 localStorage.setItem('imatt_phone_used_'+today, name+' ('+id+')');
 document.getElementById('message').innerText='✅ '+name+' Present!';
 loadCounts();
}
function loadCounts(){
 const today = new Date().toISOString().split('T')[0];
 let records = JSON.parse(localStorage.getItem('attendanceRecords') || '{}');
 let c = records[today]? Object.keys(records[today]).length : 0;
 document.getElementById('presentCount').innerText=c; document.getElementById('totalCount').innerText=c;
}
function exportExcel(){
 const today = new Date().toISOString().split('T')[0];
 let records = JSON.parse(localStorage.getItem('attendanceRecords') || '{}');
 let data = records[today]; if(!data){ alert('No data'); return; }
 let csv='Student ID,Full Name,Dept,Status,Time\n';
 for(let id in data){ csv+=id+','+data[id].name+','+data[id].dept+','+data[id].status+','+data[id].time+'\n'; }
 let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='IMATT_'+today+'.csv'; a.click();
}
showPanels();
</script>
</body>
</html>
