<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMATT - Share to Admin & Lecturers</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#0f4c2e;padding:8px}
.card{background:#e8f5e9;border:3px solid #0f3d26;border-radius:18px;padding:12px;margin-bottom:10px;max-width:500px;margin:10px auto}
.white{background:white;border-radius:16px;padding:14px}
.inp{width:100%;padding:13px;border:1.5px solid #ccc;border-radius:12px;margin:6px 0;background:#f9fafb}
.btn{padding:12px;border-radius:12px;font-weight:800;border:2px solid #0f3d26;cursor:pointer;width:100%;background:white}
.btn.active{background:#0f3d26;color:white}
.btn1{background:#0f3d26;color:white;width:100%;padding:14px;border-radius:12px;font-weight:900;border:none;margin:6px 0}
.btn2{background:#16a34a;color:white;width:100%;padding:14px;border-radius:12px;font-weight:900;border:none;margin:6px 0}
.btnWA{background:#25D366;color:white;width:100%;padding:14px;border-radius:12px;font-weight:900;border:none;margin:6px 0}
.box{background:#e8f5e9;border-radius:14px;display:flex;justify-content:space-around;text-align:center;padding:12px;margin:10px 0;border:1px solid #a7d7a9}
.box b{font-size:20px}
.head{background:#0f3d26;color:white;display:grid;grid-template-columns:0.5fr 1fr 1fr 1.2fr 0.6fr;gap:3px;padding:10px;border-radius:10px 10px 0 0;font-size:11px;font-weight:800;text-align:center}
.row{background:white;border:1px solid #e5e7eb;border-top:none;padding:8px;display:grid;grid-template-columns:0.5fr 1fr 1fr 1.2fr 0.6fr;gap:3px;align-items:center;font-size:11px;text-align:center}
.mod{background:#fef3c7;border:1px dashed #d97706;padding:4px;border-radius:6px;font-size:10px}
.st{padding:5px 7px;border-radius:12px;color:white;font-weight:800;font-size:10px}
.present{background:#16a34a}.absent{background:#dc2626}
.del{color:red;font-weight:900;cursor:pointer}
.hidden{display:none!important}
.code{font-size:32px;font-weight:900;text-align:center;background:#0f3d26;color:white;padding:12px;border-radius:12px;letter-spacing:5px;margin:8px 0}
.lock{background:#fef3c7;border:2px solid #f59e0b;padding:10px;border-radius:12px;margin:8px 0;text-align:center;font-weight:800;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center;color:#0f3d26">IMATT COLLEGE</h2>
<p id="clock" style="text-align:center;font-size:12px"></p>
<p id="curClass" style="text-align:center;font-weight:800;font-size:13px"></p>
<select class="inp" id="dept" onchange="setDept(this.value)">
<option>Computer Science</option><option>HND</option><option>Procurement</option><option>Nursing</option><option>Business Administration</option><option>Accounting & Finance</option><option>Public Admin</option><option>Banking & Finance</option><option>HRM</option><option>Marketing</option><option>Entrepreneurship</option><option>Electrical Engineering</option>
</select>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px">
<button class="btn" id="y1" onclick="setYear(1)">Y1</button>
<button class="btn active" id="y2" onclick="setYear(2)">Y2</button>
<button class="btn" id="y3" onclick="setYear(3)">Y3</button>
<button class="btn" id="y4" onclick="setYear(4)">Y4</button>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">
<button class="btn active" id="tS" onclick="tab('S')">STUDENT</button>
<button class="btn" id="tL" onclick="tab('L')">LECTURER</button>
</div>
<button class="btn" id="tA" onclick="tab('A')" style="margin-top:6px">ADMIN</button>
</div>

<div class="card white" id="pS">
<div id="deviceLock" class="hidden lock"></div>
<input class="inp" id="sid" placeholder="Student ID e.g. 1727">
<input class="inp" id="sname" placeholder="Full Name">
<input class="inp" id="smod" placeholder="Module" value="Operating System">
<select class="inp" id="sstatus"><option>Present</option><option>Absent</option></select>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
<input class="inp" id="codeIn" placeholder="Enter Code from Lec">
<button class="btn1" style="margin:6px 0" onclick="checkCode()">Check Code</button>
</div>
<p id="codeShowS" style="text-align:center;font-weight:800;color:#dc2626"></p>
<button class="btn1" id="markBtn" onclick="mark()">✔ Mark Attendance</button>
<!-- SHARE TO ADMIN AND LECTURERS - MAIN BUTTON -->
<button class="btnWA" id="waBtn" onclick="shareWA()">📲 Share to Admin and Lecturers via WhatsApp</button>
<p id="syncStatus" style="text-align:center;font-size:11px;font-weight:800;color:#16a34a"></p>
<button class="btn2" onclick="exportEx()">📊 Export Excel</button>
<div class="box"><div>Present<br><b id="pC">0</b></div><div>Absent<br><b id="aC">0</b></div><div>Total<br><b id="tC">0</b></div></div>
<div class="head"><span>Year</span><span>Name/ID</span><span>Module</span><span>Status/Date/Time</span><span>Del</span></div>
<div id="listS"></div>
</div>

<div class="card white hidden" id="pL">
<h3>Lecturer Panel</h3>
<input class="inp" id="lecPass" type="password" placeholder="Password: imatt2026">
<button class="btn1" onclick="loginL()">Login</button>
<div id="lecBox" class="hidden">
<div class="box"><div>Present<br><b id="pCL">0</b></div><div>Absent<br><b id="aCL">0</b></div><div>Total<br><b id="tCL">0</b></div></div>
<button class="btn1" onclick="genCode()">🔑 Generate Code - Only Lecturer & Admin Generate</button>
<div class="code" id="codeL"></div><p id="timerL" style="text-align:center;font-weight:800;color:red"></p>
<textarea class="inp" id="importL" placeholder="Paste WhatsApp from student"></textarea>
<button class="btnWA" onclick="importWA('L')">📥 Import - Add to Lecturer List</button>
<div class="head"><span>Year</span><span>Name/ID</span><span>Module</span><span>Status/Date/Time</span><span>Del</span></div>
<div id="listL"></div>
</div>
</div>

<div class="card white hidden" id="pA">
<h3>Admin - Issa 1727</h3>
<input class="inp" id="admPass" placeholder="Enter: issa1727">
<button class="btn1" onclick="loginA()">Login Admin</button>
<div id="admBox" class="hidden">
<div class="box"><div>Present<br><b id="pCA">0</b></div><div>Absent<br><b id="aCA">0</b></div><div>Total ALL<br><b id="tCA">0</b></div></div>
<button class="btn1" onclick="genCode()">🔑 Generate Code - Only Admin & Lecturer Generate</button>
<div class="code" id="codeA"></div><p id="timerA" style="text-align:center;font-weight:800;color:red"></p>
<textarea class="inp" id="importA" placeholder="Paste WhatsApp from student"></textarea>
<button class="btnWA" onclick="importWA('A')">📥 Import - Add to Admin List - See All 200</button>
<div class="head"><span>Year</span><span>Name/ID</span><span>Module</span><span>Status/Date/Time</span><span>Del</span></div>
<div id="listA" style="max-height:700px;overflow:auto"></div>
<button class="btn2" onclick="exportEx()">📥 Download Excel</button>
<button class="btn1" style="background:#dc2626;margin-top:6px" onclick="clearAll()">Clear ALL</button>
</div>
</div>

<div style="text-align:center;color:white;font-weight:800;font-size:12px;margin:15px 0">Built and Design by Issa Koroma Year 2</div>

<script>
let dept='Computer Science',year=2,students=JSON.parse(localStorage.getItem('imatt_all')||'[]'),currentCode=localStorage.getItem('imatt_code')||'',codeTime=parseInt(localStorage.getItem('imatt_codeT')||'0'),lastMarked=null;
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleString()},1000);
function setDept(d){dept=d;update()} function setYear(y){year=y;[1,2,3,4].forEach(i=>{document.getElementById('y'+i).classList.toggle('active',i==y)});update()}
function update(){document.getElementById('curClass').textContent=dept+' Year '+year; render(); checkDeviceLock()}
function tab(t){document.getElementById('pS').classList.add('hidden');document.getElementById('pL').classList.add('hidden');document.getElementById('pA').classList.add('hidden');
document.getElementById('tS').classList.remove('active');document.getElementById('tL').classList.remove('active');document.getElementById('tA').classList.remove('active');
if(t=='S'){document.getElementById('pS').classList.remove('hidden');document.getElementById('tS').classList.add('active')}
if(t=='L'){document.getElementById('pL').classList.remove('hidden');document.getElementById('tL').classList.add('active')}
if(t=='A'){document.getElementById('pA').classList.remove('hidden');document.getElementById('tA').classList.add('active')}}
function save(){localStorage.setItem('imatt_all',JSON.stringify(students));}
function checkDeviceLock(){
 let locked=localStorage.getItem('imatt_device_locked'); let lockDiv=document.getElementById('deviceLock');
 if(locked){ let data=JSON.parse(locked); lockDiv.classList.remove('hidden'); lockDiv.innerHTML='🔒 Locked: '+data.name+' ('+data.id+') - One phone One student'; document.getElementById('sid').value=data.id; document.getElementById('sname').value=data.name; document.getElementById('sid').disabled=true; document.getElementById('sname').disabled=true; }
 else { lockDiv.classList.add('hidden'); document.getElementById('sid').disabled=false; document.getElementById('sname').disabled=false; }
}
function mark(){
 let id=document.getElementById('sid').value.trim(),name=document.getElementById('sname').value.trim(),mod=document.getElementById('smod').value.trim()||'Operating System',st=document.getElementById('sstatus').value;
 if(!id||!name){alert('Enter ID and Name');return;}
 let locked=localStorage.getItem('imatt_device_locked');
 if(locked){ let d=JSON.parse(locked); if(d.id!=id){alert('Phone locked to '+d.name); return;} }
 if(currentCode && document.getElementById('codeIn').value.trim()!=currentCode){alert('Wrong code! Code: '+currentCode);return;}
 if(codeTime && Date.now()-codeTime>15*60*1000){alert('Code EXPIRED - Tell Lecturer to Generate new code');return;}
 let now=new Date();
 if(!locked){ localStorage.setItem('imatt_device_locked',JSON.stringify({id,name,dept,year})); }
 let idx=students.findIndex(s=>s.id==id && s.dept==dept && s.year==year);
 if(idx>=0){ students[idx].status=st; students[idx].module=mod; students[idx].date=now.toLocaleDateString(); students[idx].time=now.toLocaleTimeString(); }
 else { students.unshift({dept,year,id,name,module:mod,status:st,date:now.toLocaleDateString(),time:now.toLocaleTimeString()}); }
 lastMarked={dept,year,id,name,module:mod,status:st,date:now.toLocaleDateString(),time:now.toLocaleTimeString()};
 save(); render(); checkDeviceLock();
 document.getElementById('syncStatus').textContent='✅ Marked! Now click Share to Admin and Lecturers below';
}
function shareWA(){
 if(!lastMarked){
  let id=document.getElementById('sid').value.trim(),name=document.getElementById('sname').value.trim();
  if(!id||!name){alert('Mark Attendance first');return;}
  let mod=document.getElementById('smod').value.trim()||'Operating System',st=document.getElementById('sstatus').value;
  lastMarked={dept,year,id,name,module:mod,status:st,date:new Date().toLocaleDateString(),time:new Date().toLocaleTimeString()};
 }
 let txt=`IMATT|${lastMarked.dept}|${lastMarked.year}|${lastMarked.name}|${lastMarked.id}|${lastMarked.module}|${lastMarked.status}|${lastMarked.date}|${lastMarked.time}`;
 let msg=`*IMATT ATTENDANCE - Add me to Admin & Lecturers:*\n\nName: ${lastMarked.name}\nID: ${lastMarked.id}\nDept: ${lastMarked.dept} Year ${lastMarked.year}\nModule: ${lastMarked.module}\nStatus: ${lastMarked.status}\n\nCOPY THIS CODE:\n${txt}`;
 window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
}
function importWA(type){
 let ta=document.getElementById(type=='A'?'importA':'importL');
 let val=ta.value.trim();
 if(!val.includes('IMATT|')){alert('Paste message with IMATT|...');return;}
 let raw=val.split('IMATT|')[1];
 let parts=raw.split('|').map(p=>p.split('\n')[0].trim());
 let dpt=parts[0], yr=parseInt(parts[1]), nm=parts[2], sid=parts[3], mod=parts[4], st=parts[5], dt=parts[6]||new Date().toLocaleDateString(), tm=parts[7]||new Date().toLocaleTimeString();
 if(!sid||!nm){alert('Invalid');return;}
 if(!students.find(s=>s.id==sid && s.dept==dpt && s.year==yr)){
  students.unshift({dept:dpt,year:yr,id:sid,name:nm,module:mod,status:st,date:dt,time:tm});
  save(); render();
  alert('✅ Added to BOTH Admin and Lecturer: '+nm+' ('+sid+')');
  ta.value='';
 } else { alert('Already exists: '+sid); }
}
function checkCode(){let c=document.getElementById('codeIn').value.trim(); if(c==currentCode&&currentCode!='') alert('✅ Correct!'); else alert('❌ Wrong - Code: '+(currentCode||'Ask Lecturer/Admin'))}
function render(){
 let f=students.filter(s=>s.dept==dept&&s.year==year);
 let p=f.filter(s=>s.status=='Present').length, a=f.filter(s=>s.status=='Absent').length;
 ['pC','pCL','pCA'].forEach(id=>{let e=document.getElementById(id); if(e) e.textContent=p});
 ['aC','aCL','aCA'].forEach(id=>{let e=document.getElementById(id); if(e) e.textContent=a});
 ['tC','tCL'].forEach(id=>{let e=document.getElementById(id); if(e) e.textContent=f.length});
 let eA=document.getElementById('tCA'); if(eA) eA.textContent=students.length;
 function row(s){let idx=students.indexOf(s); return `<div class="row"><span>Y${s.year}</span><span><b>${s.name}</b><br>${s.id}</span><span><span class="mod">${s.module}</span></span><span><span class="st ${s.status=='Present'?'present':'absent'}">${s.status}</span><br><span style="font-size:9px">${s.date}<br>${s.time}</span></span><span class="del" onclick="del(${idx})">❌</span></div>`}
 let hf=''; f.forEach(s=>hf+=row(s)); let ha=''; students.forEach(s=>ha+=row(s));
 document.getElementById('listS').innerHTML=hf||'<div style="text-align:center;padding:8px">No records</div>';
 document.getElementById('listL').innerHTML=hf||'<div style="text-align:center;padding:8px">No records - Import from WhatsApp to see students from other phones</div>';
 document.getElementById('listA').innerHTML=ha||'<div style="text-align:center;padding:8px">No records - Import WhatsApp to see all 200</div>';
}
function del(i){ let locked=localStorage.getItem('imatt_device_locked'); if(locked){ let d=JSON.parse(locked); if(students[i].id==d.id){ if(!confirm('Unlock phone?')) return; localStorage.removeItem('imatt_device_locked'); }} students.splice(i,1); save(); render(); checkDeviceLock(); }
function genCode(){let c=Math.floor(1000+Math.random()*9000).toString(); currentCode=c; codeTime=Date.now(); localStorage.setItem('imatt_code',currentCode); localStorage.setItem('imatt_codeT',codeTime); let l=document.getElementById('codeL'); if(l) l.textContent=c; let a=document.getElementById('codeA'); if(a) a.textContent=c; alert('CODE for 200 students: '+c); tick();}
function tick(){if(!codeTime) return; let d=15*60*1000-(Date.now()-codeTime); let txt=d<=0?'❌ EXPIRED - Lecturer/Admin must generate new code':`⏰ ${Math.floor(d/60000)}m ${Math.floor((d%60000)/1000)}s - Code: ${currentCode}`; document.getElementById('codeShowS').textContent=txt; let l=document.getElementById('timerL'); if(l) l.textContent=txt; let a=document.getElementById('timerA'); if(a) a.textContent=txt; if(currentCode){let cl=document.getElementById('codeL'); if(cl) cl.textContent=currentCode; let ca=document.getElementById('codeA'); if(ca) ca.textContent=currentCode;}}
function loginL(){if(document.getElementById('lecPass').value=='imatt2026'){document.getElementById('lecBox').classList.remove('hidden');} else alert('Wrong')}
function loginA(){if(document.getElementById('admPass').value=='issa1727'){document.getElementById('admBox').classList.remove('hidden');} else alert('Wrong')}
function exportEx(){let csv='Year,Dept,Name,ID,Module,Status,Date,Time\n'; students.forEach(s=>{csv+=`${s.year},"${s.dept}","${s.name}",${s.id},"${s.module}",${s.status},${s.date},${s.time}\n`}); let b=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='IMATT_All_'+students.length+'.csv'; a.click();}
function clearAll(){if(confirm('Clear ALL?')){students=[];currentCode='';codeTime=0;localStorage.clear(); save(); render(); checkDeviceLock();}}
setInterval(tick,1000); update();
</script>
</body>
</html>
