<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMATT COLLEGE ATTENDANCE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a3d24;min-height:100vh;padding:12px}
.card{background:#e6f4ea;border-radius:22px;padding:18px;margin:10px 0}
.card h2{text-align:center;color:#0a3d24;font-size:28px;font-weight:900;line-height:1.1}
.card .date{text-align:center;font-size:14px;color:#000;margin:4px 0 0}
.card .dept-year{text-align:center;font-size:16px;font-weight:bold;color:#000;margin-bottom:12px}
.select-box{width:100%;padding:14px;border-radius:15px;border:2px solid #c8c8c8;background:white;font-size:15px;outline:none;margin:6px 0}
.year-row{display:flex;gap:8px;margin:10px 0}
.year-row button{flex:1;padding:14px;border-radius:15px;border:2px solid #0a3d24;background:white;font-weight:bold;font-size:15px;cursor:pointer}
.year-row button.active{background:#0a3d24;color:white}
.role-row{display:flex;gap:8px;margin:8px 0}
.role-row button{flex:1;padding:14px;border-radius:15px;border:2px solid #0a3d24;background:white;font-weight:bold;font-size:15px;cursor:pointer}
.role-row button.active{background:#0a3d24;color:white}
.role-row.full button{width:100%}
.white-card{background:white;border-radius:22px;padding:18px;margin:12px 0}
.input-white{width:100%;padding:14px;border-radius:15px;border:2px solid #c8c8c8;background:white;font-size:14px;outline:none;margin:8px 0}
.footer{text-align:center;color:white;padding:15px;font-weight:bold;font-size:13px}
</style>
</head>
<body>

<div class="card">
<h2>IMATT COLLEGE</h2>
<div class="date" id="dateTime">25/09/2026, 11:15:30 am</div>
<div class="dept-year" id="deptYearLabel">Computer Science Year 2</div>

<!-- THAT BOX YOU MARKED - NOW WITH ALL 18 COURSES -->
<select id="courseSelect" class="select-box" onchange="updateLabel()">
<optgroup label="A. DEGREE PROGRAMMES (BSc / LLB)">
<option value="Bachelor of Laws (LLB)">1. Bachelor of Laws (LLB)</option>
<option value="BSc. in Information Systems">2. BSc. in Information Systems</option>
<option value="BSc. in Business Administration">3. BSc. in Business Administration</option>
<option value="BSc. in Applied Accounting">4. BSc. in Applied Accounting</option>
<option value="BSc. in Human Resource Management">5. BSc. in Human Resource Management</option>
<option value="BSc. in Procurement and Supply Chain Management">6. BSc. in Procurement and Supply Chain Management</option>
<option value="BSc. in Marketing">7. BSc. in Marketing</option>
</optgroup>
<optgroup label="B. DIPLOMA PROGRAMMES">
<option value="Diploma in Mass Communication">1. Diploma in Mass Communication</option>
<option value="Higher Diploma in Nursing and Midwifery (SRN)">2. Higher Diploma in Nursing and Midwifery (SRN)</option>
<option value="IELTS, French and Spanish Language">3. IELTS, French Language and Spanish Language</option>
<option value="Diploma in Computer Science" selected>4. Diploma in Computer Science</option>
<option value="Diploma in Business Administration">5. Diploma in Business Administration</option>
<option value="Diploma in Project Management">6. Diploma in Project Management</option>
<option value="Diploma in Banking and Finance">7. Diploma in Banking and Finance</option>
<option value="Diploma in Human Resource Management">8. Diploma in Human Resource Management</option>
<option value="Diploma in Marketing">9. Diploma in Marketing</option>
<option value="Diploma in Procurement and Supply Chain Management">10. Diploma in Procurement and Supply Chain Management</option>
<option value="Diploma in Applied Accounting">11. Diploma in Applied Accounting</option>
</optgroup>
</select>

<div class="year-row">
<button id="y1" onclick="setYear('Y1')">Y1</button>
<button id="y2" class="active" onclick="setYear('Y2')">Y2</button>
<button id="y3" onclick="setYear('Y3')">Y3</button>
<button id="y4" onclick="setYear('Y4')">Y4</button>
</div>

<div class="role-row">
<button id="studentBtn" class="active" onclick="setRole('STUDENT')">STUDENT</button>
<button id="lecturerBtn" onclick="setRole('LECTURER')">LECTURER</button>
</div>
<div class="role-row full">
<button id="adminBtn" onclick="setRole('ADMIN')" style="width:100%">ADMIN</button>
</div>
</div>

<div class="white-card">
<input class="input-white" placeholder="Student ID e.g. 1727" id="studentId">
<input class="input-white" placeholder="Full Name" id="fullName">
<input class="input-white" placeholder="Phone Number e.g. 076123456" id="phoneNumber">
<input class="input-white" placeholder="Module e.g. Operating System" id="moduleName">
<input class="input-white" placeholder="Enter Attendance Code" id="attCode">
<button class="input-white" style="background:#0a3d24;color:white;font-weight:bold;border-color:white" onclick="submitAttendance()">SUBMIT ATTENDANCE</button>
</div>

<div class="footer">Built and Design by Issa Koroma Year 2</div>

<script>
let currentYear="Y2";
function setYear(y){ currentYear=y; document.querySelectorAll('.year-row button').forEach(b=>b.classList.remove('active')); document.getElementById(y.toLowerCase()).classList.add('active'); updateLabel(); }
function setRole(r){ document.querySelectorAll('.role-row button').forEach(b=>b.classList.remove('active')); if(r==='STUDENT') document.getElementById('studentBtn').classList.add('active'); if(r==='LECTURER') document.getElementById('lecturerBtn').classList.add('active'); if(r==='ADMIN') document.getElementById('adminBtn').classList.add('active'); }
function updateLabel(){ let course=document.getElementById('courseSelect').value; document.getElementById('deptYearLabel').innerText= course + ' ' + currentYear; }
setInterval(()=>{ let now=new Date(); document.getElementById('dateTime').innerText= now.toLocaleDateString() + ', ' + now.toLocaleTimeString(); },1000);
function submitAttendance(){ alert('Attendance Submitted: ' + document.getElementById('fullName').value); }
</script>
</body>
</html>
