<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMATT College - Attendance</title>
<style>
body{font-family:Arial;background:#0f4c3a;margin:0;padding:10px}
.card{background:#fff;border-radius:14px;padding:14px;max-width:750px;margin:10px auto}
.header{text-align:center}.header h2{margin:6px 0;color:#0f4c3a}
.motto{color:#8b0000;font-size:11px;font-weight:bold;font-style:italic}
.yearMenu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.yearBtn{padding:22px;border:none;border-radius:12px;color:#fff;font-weight:bold;font-size:14px;cursor:pointer}
.y1{background:#1e40af}.y2{background:#059669}.y3{background:#d97706}.y4{background:#7c3aed}
button.main{width:100%;padding:11px;border:none;border-radius:8px;background:#0f4c3a;color:#fff;font-weight:bold;margin-top:6px;cursor:pointer}
.page{display:none}.page.active{display:block}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:center}th{background:#0f4c3a;color:#fff}.wrap{overflow-x:auto}
.editBtn{background:#fef3c7;border:1px dashed #d97706;padding:4px 8px;border-radius:6px;cursor:pointer}
.statusBtn{border:none;padding:6px 12px;border-radius:20px;font-weight:bold;cursor:pointer;color:#fff}
.present{background:#16a34a}.absent{background:#dc2626}
.lockMsg{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin:10px 0;display:none}
.count{display:flex;justify-content:space-around;background:#ecfdf5;padding:10px;border-radius:10px;font-weight:bold;margin:10px 0;border:1px solid #d1fae5}
</style>
</head>
<body>
<div class="card">
<div class="header">
<h2>IMATT COLLEGE</h2>
<div class="motto">Education is the Source of Human Progress</div>
<div style="background:#8b0000;color:#fff;padding:4px 10px;border-radius:20px;font-size:10px;display:inline-block;margin-top:6px">OFFICIAL ATTENDANCE - Freetown</div>
</div>

<div id="home" class="page active">
<div style="text-align:center;font-weight:bold;margin:14px 0">SELECT YEAR - Each Year Sees Only Their Own</div>
<div id="lockMsg" class="lockMsg"></div>
<div class="yearMenu">
<button class="yearBtn y1" onclick="openY('Year 1')">🎓<br>Year 1</button>
<button class="yearBtn y2" onclick="openY('Year 2')">📚<br>Year 2</button>
<button class="yearBtn y3" onclick="openY('Year 3')">📖<br>Year 3</button>
<button class="yearBtn y4" onclick="openY('Year 4')">👨‍🎓<br>Final Year</button>
</div>
<button class="main" style="background:#111827" onclick="openAdmin()">🔐 Admin - View All Years</button>
</div>

<div id="att" class="page">
<button class="main" style="width:auto;background:#6b7280;padding:6px 14px" onclick="goHome()">← Back</button>
<div id="tYear" style="text-align:center;font-weight:bold;margin:10px 0;color:#0f4c3a;font-size:18px"></div>
<input id="sid" placeholder="Student ID"><input id="sname" placeholder="Full Name"><input id="ccourse" placeholder="Module"><select id="sstat"><option>Present</option><option>Absent</option></select>
<button class="main" onclick="add()">✅ Mark Attendance</button>
<button class="main" style="background:#16a34a" onclick="exp()">📊 Export Excel</button>
<div class="count"><div>Present<br><span id="pC">0</span></div><div>Absent<br><span id="aC">0</span></div><div>Total<br><span id="tC">0</span></div></div>
<div class="wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Module</th><th>Status</th><th>Time</th><th>X</th></tr></thead><tbody id="list"></tbody></table></div>
</div>
</div>

<script>
let all=JSON.parse(localStorage.getItem('imatt_final')||'null');if(!all)all={'Year 1':[],'Year 2':[],'Year 3':[],'Year 4':[]};
let idYearMap=JSON.parse(localStorage.getItem('idYearMap')||'{}');let cur='Year 1';
function openY(y){let myID=localStorage.getItem('myLastID');let myYear=localStorage.getItem('myLastYear');if(myID&&myYear&&y!=='All'&&myYear!==y){let m=document.getElementById('lockMsg');m.style.display='block';m.innerText='⛔ ACCESS DENIED: You are '+myYear+' student (ID: '+myID+'). Cannot access '+y;setTimeout(()=>{m.style.display='none'},5000);return;}cur=y;home.classList.remove('active');att.classList.add('active');tYear.innerText=y==='All'?'All Years - Admin':y;render();}
function openAdmin(){let p=prompt('Admin PIN:');if(p==='1234')openY('All');else if(p!==null)alert('Wrong PIN');}
function goHome(){att.classList.remove('active');home.classList.add('active');}
function save(){localStorage.setItem('imatt_final',JSON.stringify(all));localStorage.setItem('idYearMap',JSON.stringify(idYearMap));}
function add(){let id=sid.value.trim(),n=sname.value.trim(),m=ccourse.value.trim(),s=sstat.value;if(!id||!n||!m){alert('Fill all');return}let t=cur==='All'?'Year 2':cur;if(idYearMap[id]&&idYearMap[id]!==t){alert('⛔ ID '+id+' already in '+idYearMap[id]);return;}idYearMap[id]=t;localStorage.setItem('myLastID',id);localStorage.setItem('myLastYear',t);all[t].unshift({id:id,name:n,module:m,stat:s,time:new Date().toLocaleTimeString()});save();render();sid.value='';sname.value='';ccourse.value='';}
function toggleStat(y,i){all[y][i].stat=all[y][i].stat==='Present'?'Absent':'Present';all[y][i].time=new Date().toLocaleTimeString();save();render();}
function editMod(y,i){let nm=prompt('Edit Module:',all[y][i].module);if(!nm||!nm.trim())return;all[y][i].module=nm.trim();all[y][i].time=new Date().toLocaleTimeString();save();render();}
function del(y,i){if(confirm('Delete?')){let id=all[y][i].id;all[y].splice(i,1);let still=Object.values(all).some(a=>a.some(o=>o.id===id));if(!still)delete idYearMap[id];save();render();}}
function render(){list.innerHTML='';let p=0,a=0,t=0;let years=cur==='All'?Object.keys(all):[cur];years.forEach(y=>{all[y].forEach((s,i)=>{if(s.stat==='Present')p++;else a++;t++;list.innerHTML+=`<tr><td>${s.id}</td><td style="text-align:left">${s.name}</td><td><span class="editBtn" onclick="editMod('${y}',${i})">${s.module}</span></td><td><button class="statusBtn ${s.stat==='Present'?'present':'absent'}" onclick="toggleStat('${y}',${i})">${s.stat}</button></td><td>${s.time}</td><td><button onclick="del('${y}',${i})" style="background:red;color:#fff;border:none;padding:4px 8px;border-radius:4px">X</button></td></tr>`;});});pC.innerText=p;aC.innerText=a;tC.innerText=t;}
function exp(){let csv="Year,ID,Name,Module,Status,Time\n";let years=cur==='All'?Object.keys(all):[cur];years.forEach(y=>{all[y].forEach(s=>{csv+=`"${y}","${s.id}","${s.name}","${s.module}","${s.stat}","${s.time}"\n`;});});let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download="IMATT_"+cur+".csv";a.click();}
render();
</script>
</body>
</html>
