<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMATT COLLEGE</title>
<style>
body{background:#0a3d2e;font-family:Arial;margin:0;padding:10px}
.box{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px}
.y{padding:8px 16px;border-radius:20px;border:1px solid #0a3d2e;margin:3px;display:inline-block;cursor:pointer}
.y.active{background:#0a3d2e;color:#fff}
.btnRole{padding:8px 12px;border-radius:8px;border:1px solid #000;margin:3px}
.btnRole.active{background:#000;color:#fff}
.main{background:#0a3d2e;color:#fff;padding:12px;width:100%;border-radius:10px;font-weight:bold;border:none}
</style>
</head>
<body>
<center style="color:#fff"><h2>IMATT COLLEGE<br><span id="d"></span><br><span id="lab">Computer Science Year 1</span></h2></center>

<div class="box">
<select id="dept" onchange="changeDept()"><option>Computer Science</option><option>Business Administration</option></select><br><br>
<span class="y active" id="Y1" onclick="selectYear('Y1')">Y1</span>
<span class="y" id="Y2" onclick="selectYear('Y2')">Y2</span>
<span class="y" id="Y3" onclick="selectYear('Y3')">Y3</span>
<span class="y" id="Y4" onclick="selectYear('Y4')">Y4</span><br><br>
<button class="btnRole active" id="rS" onclick="setRole('STUDENT')">STUDENT</button>
<button class="btnRole" id="rL" onclick="setRole('LECTURER')">LECTURER</button>
<button class="btnRole" id="rA" onclick="setRole('ADMIN')">ADMIN</button>
</div>

<div id="panel"></div>
<div style="color:#fff;text-align:center;margin-top:10px">Built and Design Issa Koroma Year 2</div>

<script>
let curY='Y1', curD='Computer Science', curR='STUDENT';
document.getElementById('d').innerText=new Date().toLocaleString();

// --- LOCK HELPERS ---
function getLock(){ return JSON.parse(localStorage.getItem('imatt_device_lock')||'null'); }
function isStudentLocked(){ const l=getLock(); return l && l.role==='student'; }

function selectYear(y){
  const lock=getLock();
  // BLOCK ONLY IF STUDENT IS LOCKED AND TRYING DIFFERENT YEAR
  if(lock && lock.role==='student' && lock.year!==y){
    alert(`ACCESS DENIED!\nYou are Year ${lock.year.replace('Y','')} student (${lock.name} ${lock.id}).\nYou cannot access Year ${y.replace('Y','')}.\nOne phone - One student - One Year only.`);
    return;
  }
  curY=y;
  document.querySelectorAll('.y').forEach(b=>b.classList.remove('active'));
  document.getElementById(y).classList.add('active');
  document.getElementById('lab').innerText=`${curD} ${y.replace('Y','Year ')}`;
  render();
}
function changeDept(){
  const newD=document.getElementById('dept').value;
  const lock=getLock();
  if(lock && lock.role==='student' && lock.dept!==newD){
    alert(`ACCESS DENIED! Your phone is locked to ${lock.dept} ${lock.year}. Cannot change department.`);
    document.getElementById('dept').value=lock.dept;
    return;
  }
  curD=newD; document.getElementById('lab').innerText=`${curD} ${curY.replace('Y','Year ')}`;
  render();
}
function setRole(r){
  curR=r;
  document.querySelectorAll('.btnRole').forEach(b=>b.classList.remove('active'));
  document.getElementById(r==='STUDENT'?'rS':r==='LECTURER'?'rL':'rA').classList.add('active');
  render();
}
function key(){ return `att_${curD}_${curY}`; }
function getRecs(){ return JSON.parse(localStorage.getItem(key())||'[]'); }
function saveRecs(a){ localStorage.setItem(key(), JSON.stringify(a)); }

function render(){
  const lock=getLock();
  let html='';

  if(curR==='STUDENT'){
    if(lock && lock.role==='student'){
      html+=`<div class="box" style="background:#fff3cd;border:2px solid orange"><b>Locked:</b> ${lock.name} (${lock.id}) - One phone One student<br><b>Locked to:</b> ${lock.dept} ${lock.year}</div>`;
    }
    html+=`<div class="box">
      <input id="sName" placeholder="Full Name" style="width:100%;padding:10px"><br><br>
      <input id="sId" placeholder="ID e.g 1234" style="width:100%;padding:10px"><br><br>
      <select id="mod" style="width:100%;padding:10px"><option>Operating System</option><option>Networking</option></select><br><br>
      <input id="codeIn" placeholder="Enter Code from Lecturer" style="width:70%;padding:10px">
      <button onclick="checkCode()">Check</button><p id="msg"></p>
      <button class="main" onclick="mark()">✔ Mark Attendance</button>
      <div style="margin-top:10px">Present: ${getRecs().length}</div>
    </div>`;
  } else {
    // LECTURER AND ADMIN CAN SEE ALL YEARS - THEY ARE NOT BLOCKED
    const recs=getRecs();
    html+=`<div class="box"><h3>${curR} Panel - ${curD} ${curY}</h3>
      <button class="main" onclick="gen()">🔑 Generate Code - Only ${curR} & Admin</button>
      <h1 style="text-align:center;font-size:40px" id="cD">${localStorage.getItem('code_'+key())||'----'}</h1>
      <p>Present: ${recs.length} | Total: ${recs.length}</p>
      <table border=1 width=100%><tr><th>Year</th><th>Name/ID</th><th>Module</th><th>Status</th></tr>
      ${recs.map(r=>`<tr><td>${r.year}</td><td>${r.name}<br>${r.id}</td><td>${r.module}</td><td>${r.status}</td></tr>`).join('')}
      </table>
      <p style="color:green">Admin/Lecturer has access to ALL Years Y1,Y2,Y3,Y4 - Just click Y buttons on top</p>
    </div>`;
  }
  document.getElementById('panel').innerHTML=html;
}

function gen(){
  const c=Math.floor(1000+Math.random()*9000);
  localStorage.setItem('code_'+key(), c);
  localStorage.setItem('code_time_'+key(), Date.now());
  document.getElementById('cD').innerText=c;
}
function checkCode(){
  const v=document.getElementById('codeIn').value;
  const real=localStorage.getItem('code_'+key());
  document.getElementById('msg').innerText = (v==real) ? '✅ Code Correct' : '❌ EXPIRED - Lecturer/Admin must generate new code';
}

function mark(){
  const name=document.getElementById('sName').value.trim();
  const id=document.getElementById('sId').value.trim();
  const mod=document.getElementById('mod').value;
  if(!name||!id){ alert('Enter name and ID'); return; }

  const lock=getLock();

  // CASE 1: Phone already locked as student
  if(lock && lock.role==='student'){
    // Same phone trying different ID?
    if(lock.id!==id){
      alert(`BLOCKED! One phone - One ID only.\nThis phone is already locked to:\n${lock.name} (${lock.id})\nYou cannot register with different ID ${id} on same phone.`);
      return;
    }
    // Same ID but trying different Year?
    if(lock.year!==curY){
      alert(`You are Year ${lock.year.replace('Y','')} student. You cannot get access on Year ${curY.replace('Y','')}.`);
      return;
    }
  }

  // CASE 2: First time registration - Lock the phone
  if(!lock){
    localStorage.setItem('imatt_device_lock', JSON.stringify({name,id,year:curY,dept:curD,role:'student'}));
  }

  let recs=getRecs();
  if(recs.find(r=>r.id===id)){ alert('You have already marked attendance for this year'); return; }
  
  recs.push({year:curY, dept:curD, name, id, module:mod, status:'Present', time:new Date().toLocaleString()});
  saveRecs(recs);
  alert(`Attendance marked for ${curY}`);
  render();
}
render();
</script>
</body>
</html>
