<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imatt College LIVE</title>
<style>
body{font-family:Arial;background:#f4f6fb;margin:0;padding:12px}
.card{background:#fff;border-radius:15px;padding:16px;max-width:750px;margin:auto;box-shadow:0 5px 15px #0001}
h2{text-align:center;margin:0;color:#1e40af}.live{text-align:center;color:#16a34a;font-weight:bold;font-size:13px;margin:5px 0}
input,select{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box;font-size:15px}
button{width:100%;padding:13px;border:none;border-radius:10px;background:#1e40af;color:#fff;font-weight:bold;margin-top:7px;font-size:15px}
.filt{display:flex;gap:5px;margin:12px 0;flex-wrap:wrap}.filt button{width:auto;flex:1;padding:10px;background:#eef2ff;color:#1e40af;border:1px solid #c7d2fe;font-size:13px}
.filt button.active{background:#1e40af;color:#fff}
.countBox{display:flex;justify-content:space-around;background:#eef2ff;padding:12px;border-radius:12px;font-weight:bold;text-align:center;margin:10px 0}
.countBox span{font-size:20px}.presentC{color:#16a34a}.absentC{color:#dc2626}.totalC{color:#1e40af}
.wrap{overflow-x:auto} table{width:100%;border-collapse:collapse;font-size:13px;min-width:650px}
th,td{border-bottom:1px solid #eee;padding:9px;text-align:center} th{background:#1e40af;color:#fff}
.status{padding:6px 12px;border-radius:20px;font-weight:bold;cursor:pointer;display:inline-block}
.status.Present{background:#dcfce7;color:#166534;border:1px solid #86efac}
.status.Absent{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.viewInfo{text-align:center;background:#fffbeb;border:1px solid #fde68a;padding:8px;border-radius:10px;font-size:13px;margin:8px 0;color:#92400e}
</style>
</head>
<body>
<div class="card">
<h2>Imatt College LIVE</h2>
<div class="live">● LIVE - Everybody sees same list</div>
<div id="viewInfo" class="viewInfo">Viewing: All Years</div>

<input id="sid" placeholder="Student ID e.g. 1727">
<input id="sname" placeholder="Student Full Name">
<select id="year">
<option>Year 1</option>
<option>Year 2</option>
<option>Year 3</option>
<option>Year 4 - Final Year</option>
</select>
<input id="course" placeholder="Module e.g. Critical Thinking">
<select id="status"><option>Present</option><option>Absent</option></select>
<button onclick="add()">Mark Attendance</button>
<button onclick="exportCSV()" style="background:#16a34a">Export to Excel (Current View)</button>

<div class="filt">
<button onclick="setFilter('All')" id="bAll" class="active">All Years</button>
<button onclick="setFilter('Year 1')" id="b1">Year 1</button>
<button onclick="setFilter('Year 2')" id="b2">Year 2</button>
<button onclick="setFilter('Year 3')" id="b3">Year 3</button>
<button onclick="setFilter('Year 4 - Final Year')" id="b4">Final Year</button>
</div>

<div class="countBox">
<div>Present<br><span class="presentC" id="pCount">0</span></div>
<div>Absent<br><span class="absentC" id="aCount">0</span></div>
<div>Total<br><span class="totalC" id="tCount">0</span></div>
</div>

<div class="wrap"><table><thead><tr><th>Year</th><th>ID</th><th>Name</th><th>Module</th><th>Status</th><th>Time</th><th>Del</th></tr></thead><tbody id="list"></tbody></table></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2V2v2R2_example_REPLACE_WITH_YOURS",
  authDomain: "imatt-attendance.firebaseapp.com",
  databaseURL: "https://imatt-attendance-default-rtdb.firebaseio.com",
  projectId: "imatt-attendance",
  storageBucket: "imatt-attendance.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abc123"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const dbRef = ref(db, 'attendance');

let allData = {};
let curFilter = 'All';

window.setFilter = (f)=>{
 curFilter=f;
 document.querySelectorAll('.filt button').forEach(b=>b.classList.remove('active'));
 if(f==='All') bAll.classList.add('active');
 if(f==='Year 1') b1.classList.add('active');
 if(f==='Year 2') b2.classList.add('active');
 if(f==='Year 3') b3.classList.add('active');
 if(f==='Year 4 - Final Year') b4.classList.add('active');
 document.getElementById('viewInfo').innerText = f==='All'? 'Viewing: All Years - Everybody' : 'Viewing: '+f+' Only - Only '+f+' students see this list';
 render();
}

window.add = ()=>{
 let id=sid.value.trim(), name=sname.value.trim(), yr=year.value, mod=course.value.trim(), st=status.value;
 if(!id||!name||!mod){alert('Fill ID, Name, Module');return}
 push(dbRef, {id,name,year:yr,module:mod,status:st,time:new Date().toLocaleTimeString(), date:new Date().toDateString()});
 sid.value=''; sname.value=''; course.value='';
}

window.del = (k)=>{ if(confirm('Delete?')) remove(ref(db,'attendance/'+k)); }
window.toggle = (k,curr)=>{ let ns=curr==='Present'?'Absent':'Present'; update(ref(db,'attendance/'+k),{status:ns,time:new Date().toLocaleTimeString()}); }

onValue(dbRef, (snap)=>{
 allData = snap.val()||{};
 render();
});

function render(){
 list.innerHTML=''; let p=0,a=0,t=0;
 Object.keys(allData).forEach(k=>{
   let s=allData[k];
   if(curFilter!=='All' && s.year!==curFilter) return;
   if(s.status==='Present') p++; else a++; t++;
   list.innerHTML+=`<tr><td>${s.year.replace(' - Final Year','')}</td><td>${s.id}</td><td style="text-align:left">${s.name}</td><td style="text-align:left">${s.module}</td><td><span class="status ${s.status}" onclick="toggle('${k}','${s.status}')">${s.status}</span></td><td>${s.time}</td><td><button onclick="del('${k}')" style="width:auto;padding:5px 10px;background:#ef4444">X</button></td></tr>`;
 });
 pCount.innerText=p; aCount.innerText=a; tCount.innerText=t;
}

window.exportCSV = ()=>{
 let csv="Year,ID,Name,Module,Status,Time,Date\n";
 Object.values(allData).forEach(s=>{
   if(curFilter!=='All' && s.year!==curFilter) return;
   csv+=`"${s.year}","${s.id}","${s.name}","${s.module}","${s.status}","${s.time}","${s.date}"\n`;
 });
 let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download="Imatt_"+curFilter+"_"+new Date().toDateString()+".csv"; a.click();
}
</script>
</body>
</html>
