<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMATT COLLEGE ATTENDANCE</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a3d24;min-height:100vh;padding:10px}
.header{text-align:center;color:white;padding:10px 0 5px;font-weight:bold;font-size:22px;letter-spacing:1px}
.top-card{background:#e6f4ea;border-radius:20px;display:flex;justify-content:space-around;padding:15px;margin:10px 0;text-align:center}
.top-card div{font-weight:bold}
.top-card span{display:block;font-size:22px;margin-top:3px}
.btn-dark{background:#0a3d24;border:3px solid white;color:white;width:100%;padding:14px;border-radius:15px;font-weight:bold;font-size:16px;margin:8px 0;cursor:pointer}
.code-box{background:#0a3d24;border:3px solid white;color:white;width:100%;padding:15px;border-radius:15px;font-weight:bold;font-size:40px;letter-spacing:8px;text-align:center;margin:8px 0}
.timer{text-align:center;color:#ff0000;font-weight:bold;font-size:18px;margin:5px 0}
.input-box{width:100%;padding:15px;border-radius:15px;border:2px solid #ccc;outline:none;font-size:15px;margin:5px 0}
.btn-green{background:#00c853;color:white;width:100%;padding:14px;border-radius:15px;font-weight:bold;font-size:16px;border:none;margin:8px 0;cursor:pointer}
.table-card{background:white;border-radius:15px;overflow:hidden;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#0a3d24;color:white;padding:8px 4px;font-size:12px}
td{padding:8px 4px;text-align:center;border-bottom:1px solid #eee}
.badge-present{background:#00c853;color:white;padding:5px 8px;border-radius:12px;font-weight:bold;font-size:12px;display:inline-block}
.module-badge{background:#fff8c4;border:1px dashed #d4a017;padding:3px 6px;border-radius:8px;font-size:11px}
.del{color:red;font-weight:bold;cursor:pointer;font-size:18px}
.footer{text-align:center;color:white;padding:15px;font-weight:bold;font-size:14px;margin-top:10px}
.login-box{background:#e6f4ea;border-radius:20px;padding:20px;margin-top:30px;text-align:center;border:3px solid #0a3d24}
</style>
</head>
<body>

<div id="loginView">
<div class="login-box">
<h2 style="color:#0a3d24;margin-bottom:15px">IMATT COLLEGE ATTENDANCE</h2>
<input id="passInput" class="input-box" placeholder="Enter Password: imatt2026 / issa1727" type="password">
<button class="btn-green" onclick="login()">LOGIN</button>
<p style="font-size:12px;margin-top:10px;color:#333">Lecturer: imatt2026 | Admin: issa1727</p>
</div>
<div class="footer">Built and Design by Issa Koroma Year 2</div>
</div>

<div id="mainView" style="display:none">
<div class="header">IMATT COLLEGE ATTENDANCE</div>

<div class="top-card">
<div>Present<br><span id="presentCount">0</span></div>
<div>Absent<br><span id="absentCount">0</span></div>
<div>Total<br><span id="totalCount">0</span></div>
</div>

<button class="btn-dark" onclick="generateCode()">🔑 Generate Code - Only Lecturer & Admin Generate</button>
<div class="code-box" id="codeDisplay">----</div>
<div class="timer" id="timerDisplay">⏰ No Code Yet</div>

<input id="whatsappInput" class="input-box" placeholder="Paste WhatsApp from student">
<button id="importBtn" class="btn-green" onclick="importStudent()">📥 Import - Add to Lecturer List</button>

<div class="table-card">
<table>
<thead><tr><th>Year</th><th>Name/ID</th><th>Module</th><th>Status/Date/Time</th><th>Del</th></tr></thead>
<tbody id="attendanceBody"></tbody>
</table>
</div>

<!-- THIS IS THE PART YOU ASKED FOR - NOW BOTH LECTURER & ADMIN HAVE IT -->
<button class="btn-green" onclick="downloadExcel()" style="margin-top:10px">📥 Download Excel</button>
<button class="btn-dark" style="background:#d32f2f;border-color:white" onclick="clearAll()">Clear ALL</button>

<div class="footer">Built and Design by Issa Koroma Year 2</div>
</div>

<script>
let currentCode="";let expiry=0;let timerInt=null;let role="lecturer";
let data=JSON.parse(localStorage.getItem("imatt_attendance")||"[]");

function login(){
 let p=document.getElementById("passInput").value.trim();
 if(p==="issa1727"){role="admin";document.getElementById("importBtn").innerText="📥 Import - Add to Admin List - See All 200";}
 else if(p==="imatt2026"){role="lecturer";document.getElementById("importBtn").innerText="📥 Import - Add to Lecturer List";}
 else{alert("Wrong Password!");return;}
 document.getElementById("loginView").style.display="none";
 document.getElementById("mainView").style.display="block";
 render();
}

function generateCode(){
 currentCode=Math.floor(1000+Math.random()*9000).toString();
 expiry=Date.now()+7*60*1000;
 localStorage.setItem("imatt_code",currentCode);
 localStorage.setItem("imatt_expiry",expiry);
 document.getElementById("codeDisplay").innerText=currentCode.split("").join(" ");
 startTimer();
}

function startTimer(){
 clearInterval(timerInt);
 timerInt=setInterval(()=>{
  let diff=expiry-Date.now();
  if(diff<=0){document.getElementById("timerDisplay").innerText="⏰ Code Expired";clearInterval(timerInt);return;}
  let m=Math.floor(diff/60000);let s=Math.floor((diff%60000)/1000);
  document.getElementById("timerDisplay").innerHTML=`⏰ ${m}m ${s}s - Code: ${currentCode}`;
 },1000);
}

function importStudent(){
 let txt=document.getElementById("whatsappInput").value.trim();
 if(!txt){alert("Paste student data");return;}
 // Expected format: Name - ID - Year - Module OR just parse
 let parts=txt.split(/[\n,-]+/).map(x=>x.trim()).filter(x=>x);
 let name=parts[0]||"Unknown";let id=parts[1]||Math.floor(1000+Math.random()*9000);let year=parts[2]||"Y2";let module=parts[3]||"Operating System";
 let now=new Date();let dateStr=now.toLocaleDateString("en-GB").replaceAll("/","/");let timeStr=now.toLocaleTimeString();
 // Format like screenshot: 25/09/2026 09:27:24
 let d=`${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
 let t=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
 let entry={year:year.includes("Y")?year:"Y2",name:name,id:id,module:module,date:d,time:t,status:"Present"};
 data.push(entry);
 localStorage.setItem("imatt_attendance",JSON.stringify(data));
 document.getElementById("whatsappInput").value="";
 render();
}

function render(){
 let body=document.getElementById("attendanceBody");body.innerHTML="";
 data.forEach((r,i)=>{
  body.innerHTML+=`<tr>
  <td>${r.year}</td>
  <td><b>${r.name}</b><br>${r.id}</td>
  <td><span class="module-badge">${r.module}</span></td>
  <td><span class="badge-present">${r.status}</span><br>${r.date}<br>${r.time}</td>
  <td><span class="del" onclick="delRow(${i})">❌</span></td>
  </tr>`;
 });
 document.getElementById("presentCount").innerText=data.length;
 document.getElementById("totalCount").innerText=data.length;
 document.getElementById("absentCount").innerText=0;
}

function delRow(i){if(confirm("Delete?")){data.splice(i,1);localStorage.setItem("imatt_attendance",JSON.stringify(data));render();}}
function clearAll(){if(confirm("Clear ALL Attendance?")){data=[];localStorage.setItem("imatt_attendance",JSON.stringify(data));render();}}

function downloadExcel(){
 if(data.length===0){alert("No data to export");return;}
 let wsData=[["Year","Name","ID","Module","Status","Date","Time"]];
 data.forEach(r=>{wsData.push([r.year,r.name,r.id,r.module,r.status,r.date,r.time])});
 let wb=XLSX.utils.book_new();let ws=XLSX.utils.aoa_to_sheet(wsData);
 XLSX.utils.book_append_sheet(wb,ws,"Attendance");
 XLSX.writeFile(wb,`IMATT_COLLEGE_ATTENDANCE_${new Date().toISOString().slice(0,10)}.xlsx`);
}

// Restore code if exists
let savedCode=localStorage.getItem("imatt_code");let savedExp=localStorage.getItem("imatt_expiry");
if(savedCode && savedExp && Date.now()<parseInt(savedExp)){currentCode=savedCode;expiry=parseInt(savedExp);document.getElementById("codeDisplay").innerText=currentCode.split("").join(" ");startTimer();}
</script>
</body>
</html>
