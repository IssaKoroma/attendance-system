<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMATT COLLEGE ATTENDANCE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a3d24;min-height:100vh;padding:12px}
.card{background:#e6f4ea;border-radius:22px;padding:18px}
.card h2{text-align:center;color:#0a3d24;font-size:30px;font-weight:900}
.card .date{text-align:center;font-size:15px;margin:4px 0}
.card .dept{text-align:center;font-weight:bold;font-size:17px;margin-bottom:12px}
.select-box{width:100%;padding:15px;border-radius:15px;border:2px solid #ddd;background:white;font-size:15px;margin:8px 0}
.year-row{display:flex;gap:8px;margin:10px 0}
.year-row button{flex:1;padding:14px;border-radius:15px;border:2px solid #0a3d24;background:white;font-weight:bold;cursor:pointer}
.year-row button.active{background:#0a3d24;color:white}
.role-row{display:flex;gap:8px;margin:8px 0}
.role-row button{flex:1;padding:14px;border-radius:15px;border:2px solid #0a3d24;background:white;font-weight:bold;cursor:pointer}
.role-row button.active{background:#0a3d24;color:white}
.white-card{background:white;border-radius:22px;padding:18px;margin-top:14px}
.input-white{width:100%;padding:14px;border-radius:15px;border:1.5px solid #ccc;margin:8px 0;background:white}
.footer{text-align:center;color:white;padding:15px;font-weight:bold}
</style>
</head>
<body>

<div class="card">
<h2>IMATT COLLEGE</h2>
<div class="date" id="dateTime">25/09/2026, 11:15:30 am</div>
<div class="dept" id="labelDept">Diploma in Computer Science Year 2</div>

<select id="courseSelect" class="select-box" onchange="updateLabel()">
<option value="" disabled>--- SELECT COURSE ---</option>
<optgroup label="A. DEGREE PROGRAMMES (BSc / LLB)">
<option>Bachelor of Laws (LLB)</option>
<option>BSc. in Information Systems</option>
<option>BSc. in Business Administration</option>
<option>BSc. in Applied Accounting</option>
<option>BSc. in Human Resource Management</option>
<option>BSc. in Procurement and Supply Chain Management</option>
<option>BSc. in Marketing</option>
</optgroup>
<optgroup label="B. DIPLOMA PROGRAMMES">
<option>Diploma in Mass Communication</option>
<option>Higher Diploma in Nursing and Midwifery (SRN)</option>
<option>IELTS, French Language and Spanish Language</option>
<option selected>Diploma in Computer Science</option>
<option>Diploma in Business Administration</option>
<option>Diploma in Project Management</option>
<option>Diploma in Banking and Finance</option>
<option>Diploma in Human Resource Management</option>
<option>Diploma in Marketing</option>
<option>Diploma in Procurement and Supply Chain Management</option>
<option>Diploma in Applied Accounting</option>
</optgroup>
</select>

<div class="year-row">
<button id="y1" onclick="setYear('Y1')">Y1</button>
<button id="y2" class="active" onclick="setYear('Y2')">Y2</button>
<button id="y3" onclick="setYear('Y3')">Y3</button>
<button id="y4" onclick="setYear('Y4')">Y4</button>
</div>

<div class="role-row">
<button id="sBtn" class="active" onclick="setRole('STUDENT')">STUDENT</button>
<button id="lBtn" onclick="setRole('LECTURER')">LECTURER</button>
</div>
<div class="role-row"><button id="aBtn" style="width:100%" onclick="setRole('ADMIN')">ADMIN</button></div>
</div>

<div class="white-card">
<input class="input-white" placeholder="Student ID e.g. 1727">
<input class="input-white" placeholder="Full Name">
<input class="input-white" placeholder="Phone Number">
<input class="input-white" placeholder="Module e.g. Operating System">
<input class="input-white" placeholder="Enter Code">
</div>

<div class="footer">Built and Design by Issa Koroma Year 2</div>

<script>
let curYear="Year 2";
function setYear(y){curYear=y; document.querySelectorAll('.year-row button').forEach(b=>b.classList.remove('active')); document.getElementById(y.toLowerCase()).classList.add('active'); updateLabel();}
function setRole(r){document.querySelectorAll('.role-row button').forEach(b=>b.classList.remove('active')); if(r=='STUDENT')sBtn.classList.add('active'); if(r=='LECTURER')lBtn.classList.add('active'); if(r=='ADMIN')aBtn.classList.add('active');}
function updateLabel(){ let c=document.getElementById('courseSelect').value; document.getElementById('labelDept').innerText=c+' '+curYear; }
setInterval(()=>{ document.getElementById('dateTime').innerText=new Date().toLocaleString(); },1000);
</script>
</body>
</html>
