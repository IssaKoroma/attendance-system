<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMATT College - Official Attendance</title>
<style>
body{font-family:Arial;background:#0f4c3a;margin:0;padding:10px}
.card{background:#fff;border-radius:14px;padding:14px;max-width:800px;margin:10px auto}
.header{text-align:center}.header h2{margin:6px 0;color:#0f4c3a}
.motto{color:#8b0000;font-size:11px;font-weight:bold;font-style:italic}
.yearMenu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.yearBtn{padding:18px;border:none;border-radius:12px;color:#fff;font-weight:bold;font-size:13px;cursor:pointer}
.y1{background:#1e40af}.y2{background:#059669}.y3{background:#d97706}.y4{background:#7c3aed}
.deptBtn{background:#ffffff;color:#0f4c3a;border:2px solid #0f4c3a;padding:12px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:12px}
button.main{width:100%;padding:11px;border:none;border-radius:8px;background:#0f4c3a;color:#fff;font-weight:bold;margin-top:6px;cursor:pointer}
.page{display:none}.page.active{display:block}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:650px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:center}th{background:#0f4c3a;color:#fff}.wrap{overflow-x:auto}
.lockMsg{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;text-align:center;font-weight:bold;margin:10px 0;display:none}
input,select{width:100%;padding:10px;margin:4px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
</style>
</head>
<body>
<div class="card">
<div class="header">
<h2>IMATT COLLEGE</h2>
<div class="motto">Education is the Source of Human Progress</div>
</div>

<div id="deptPage" class="page active">
<div style="text-align:center;font-weight:bold;margin:14px 0">SELECT DEPARTMENT</div>
<div class="yearMenu" id="deptList"></div>
</div>

<div id="home" class="page">
<button class="main" style="width:auto;background:#6b7280" onclick="goDept()">← Departments</button>
<div id="deptTitle" style="text-align:center;font-weight:bold;color:#8b0000;margin:10px 0"></div>
<div style="text-align:center;font-weight:bold;margin:10px 0">SELECT YEAR</div>
<div id="lockMsg" class="lockMsg"></div>
<div class="yearMenu">
<button class="yearBtn y1" onclick="openY('Year 1')">Year 1</button>
<button class="yearBtn y2" onclick="openY('Year 2')">Year 2</button>
<button class="yearBtn y3" onclick="openY('Year 3')">Year 3</button>
<button class="yearBtn y4" onclick="openY('Year 4')">Final Year</button>
</div>
<button class="main" style="background:#111827" onclick="openAdmin()">🔐 Admin - View All (Enter PIN)</button>
<button class="main" style="background:#6b7280" onclick="changePin()">⚙️ Change Admin PIN</button>
<div style="text-align:center;margin-top:14px;font-size:11px;font-weight:bold">This website built and Design by Issa Koroma year 2 student</div>
</div>

<div id="att" class="page">
<button class="main" style="width:auto;background:#6b7280" onclick="goHome()">← Back</button>
<div id="tYear" style="text-align:center;font-weight:bold;margin:10px 0"></div>
<input id="sid" placeholder="Student ID">
<input id="sname" placeholder="Full Name">
<input id="ccourse" placeholder="Module">
<select id="sstat"><option>Present</option><option>Absent</option></select>
<button class="main" onclick="add()">✅ Mark Attendance</button>
<button class="main" style="background:#16a34a" onclick="exp()">📊 Export Excel</button>
<div id="list"></div>
</div>
</div>

<script>
const departments=["Law (LLB)","Information Systems","Business Administration","Applied Accounting","Human Resource Mgt","Procurement & Supply","Nursing (SRN)","Computer Science"];
let curDept=""; let curYear="Year 1";
let all=JSON.parse(localStorage.getItem('imatt_dept_final')||'null');
if(!all){all={}; departments.forEach(d=>{all[d]={'Year 1':[],'Year 2':[],'Year 3':[],'Year 4':[]}});}
let idYearMap=JSON.parse(localStorage.getItem('idYearMapDept')||'{}');

function getPin(){return localStorage.getItem('adminPin') || '1234';}

function renderDepts(){let h="";departments.forEach(d=>{h+=`<button class="deptBtn" onclick="selectDept('${d}')">${d}</button>`});document.getElementById('deptList').innerHTML=h;} renderDepts();
function selectDept(d){curDept=d; document.getElementById('deptTitle').innerText=d; deptPage.classList.remove('active'); home.classList.add('active');}
function goDept(){home.classList.remove('active'); deptPage.classList.add('active');}
function goHome(){att.classList.remove('active'); home.classList.add('active');}
function openY(y){curYear=y; home.classList.remove('active'); att.classList.add('active'); tYear.innerText=curDept+" - "+y;}
function openAdmin(){let p=prompt('Enter Admin PIN (Default is 1234):'); if(p===getPin())openY('All'); else if(p!==null)alert('Wrong PIN. Current PIN is saved in phone.');}
function changePin(){
let oldPin=prompt('Enter OLD PIN:'); if(oldPin!==getPin()){alert('Wrong old PIN!');return;}
let newPin=prompt('Enter NEW PIN (4 numbers):'); if(!newPin||newPin.length<4){alert('PIN too short');return;}
let confirmPin=prompt('Confirm NEW PIN:'); if(newPin!==confirmPin){alert('PINs not match!');return;}
localStorage.setItem('adminPin',newPin); alert('✅ Success! New PIN is now: '+newPin);
}
function save(){localStorage.setItem('imatt_dept_final',JSON.stringify(all)); localStorage.setItem('idYearMapDept',JSON.stringify(idYearMap));}
function add(){
let id=sid.value.trim(),n=sname.value.trim(),m=ccourse.value.trim(),s=sstat.value; if(!id||!n||!m){alert('Fill all');return}
let t=curYear==='All'?'Year 2':curYear; if(idYearMap[id]&& (idYearMap[id].dept!==curDept || idYearMap[id].year!==t) ){alert('ID already in '+idYearMap[id].dept+' '+idYearMap[id].year);return;}
idYearMap[id]={dept:curDept,year:t}; all[curDept][t].unshift({id:id,name:n,module:m,stat:s,time:new Date().toLocaleTimeString()}); save(); alert('Marked!');
}
function exp(){let csv="Dept,Year,ID,Name,Module,Status,Time\n"; let years=curYear==='All'?Object.keys(all[curDept]):[curYear]; years.forEach(y=>{all[curDept][y].forEach(s=>{csv+=`"${curDept}","${y}","${s.id}","${s.name}","${s.module}","${s.stat}","${s.time}"\n`;});}); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=curDept+"_"+curYear+".csv"; a.click();}
</script>
</body>
</html>
