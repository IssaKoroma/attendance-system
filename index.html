<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMATT - Attendance</title>
<style>
body{background:#0a3d2e;font-family:Arial;margin:0;padding:10px}
.card{background:white;max-width:500px;margin:auto;border-radius:18px;padding:18px}
h1{color:#0a3d2e;text-align:center;margin:5px}
.sub{color:#8b0000;text-align:center;font-style:italic;font-weight:bold;font-size:14px}
.badge{background:#8b0000;color:white;padding:6px 14px;border-radius:20px;display:block;width:fit-content;margin:8px auto;font-size:12px}
.btn-back{background:#6c757d;color:white;border:none;padding:10px 15px;border-radius:20px;font-weight:bold}
.dept-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.dept-btn{border:2px solid #0a3d2e;padding:14px;border-radius:12px;background:white;font-weight:bold;color:#0a3d2e}
.year-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.year-btn{padding:18px;border-radius:14px;border:none;color:white;font-weight:bold}
.y1{background:#1e3a8a}.y2{background:#0e9f6e}.y3{background:#d97706}.y4{background:#7c3aed}
input{width:100%;padding:12px;margin:7px 0;border-radius:9px;border:1px solid #bbb;box-sizing:border-box}
button.main{background:#0a3d2e;color:white;padding:12px;border:none;border-radius:9px;font-weight:bold;width:100%;margin-top:6px}
.hidden{display:none}
.teacher-box{background:#e8f8f5;border:2px solid #0a3d2e;padding:12px;border-radius:10px;margin:12px 0}
.lock-box{background:#fff3cd;border:2px solid #ff9800;padding:10px;border-radius:10px;text-align:center;font-weight:bold;color:#856404}
#todayCode{font-size:26px;color:red;font-weight:bold}
#timer{color:red;font-weight:bold}
.small{font-size:11px;color:gray;text-align:center}
</style>
</head>
<body>
<div class="card">
<h1>IMATT COLLEGE</h1>
<div class="sub">Education is the Source of Human Progress</div>
<div class="badge">OFFICIAL ATTENDANCE</div>

<div id="teacherLogin" style="margin-top:10px;background:#f1f1f1;padding:8px;border-radius:8px">
<input type="password" id="teacherPass" placeholder="Lecturer Password (Students skip)">
<button class="main" onclick="teacherLogin()" style="background:#444">Login as Lecturer</button>
</div>

<div id="teacherPanel" class="hidden">
<div class="teacher-box">
<p style="text-align:center">✅ LECTURER: <span id="teachingInfo"></span></p>
<p>Code for <span id="codeDeptYear"></span>: <span id="todayCode">Not Generated</span></p>
<p>Time Left: <span id="timer">--:--</span></p>
<button class="main" onclick="generateCode()">Generate Code For This Class</button>
<p>Present: <b id="presentCount">0</b></p>
<div id="todayList" style="font-size:13px"></div>
<button class="main" onclick="exportExcel()" style="background:#27ae60">Download Excel</button>
<button class="main" onclick="teacherLogout()" style="background:gray">Logout Lecturer</button>
</div>
</div>

<div id="stepDept">
<h2 style="text-align:center">SELECT DEPARTMENT</h2>
<div class="dept-grid">
<button class="dept-btn" onclick="selectDept('Law (LLB)')">Law (LLB)</button>
<button class="dept-btn" onclick="selectDept('Information Systems')">Information Systems</button>
<button class="dept-btn" onclick="selectDept('Business Administration')">Business Administration</button>
<button class="dept-btn" onclick="selectDept('Applied Accounting')">Applied Accounting</button>
<button class="dept-btn" onclick="selectDept('Human Resource Mgt')">Human Resource Mgt</button>
<button class="dept-btn" onclick="selectDept('Procurement & Supply')">Procurement & Supply</button>
<button class="dept-btn" onclick="selectDept('Nursing (SRN)')">Nursing (SRN)</button>
<button class="dept-btn" onclick="selectDept('Computer Science')">Computer Science</button>
</div>
<div id="studentLockInfo"></div>
</div>

<div id="stepYear" class="hidden">
<button class="btn-back" onclick="backToDept()">← Back to Departments</button>
<div style="background:#e6f4ea;padding:10px;border-radius:8px;text-align:center;margin:10px 0;font-weight:bold" id="deptNameShow"></div>
<h2 style="text-align:center">SELECT YEAR</h2>
<div id="yearLockWarning"></div>
<div class="year-grid">
<button class="year-btn y1" id="btnY1" onclick="selectYear('Year 1')">🎓<br>Year 1</button>
<button class="year-btn y2" id="btnY2" onclick="selectYear('Year 2')">📚<br>Year 2</button>
<button class="year-btn y3" id="btnY3" onclick="selectYear('Year 3')">📖<br>Year 3</button>
<button class="year-btn y4" id="btnY4" onclick="selectYear('Final Year')">👨‍🎓<br>Final Year</button>
</div>
</div>

<div id="stepAttendance" class="hidden">
<button class="btn-back" onclick="backToYear()">← Back to Years</button>
<h3 style="text-align:center"><span id="finalDept"></span> - <span id="finalYear"></span></h3>
<div id="studentForm">
<input type="text" id="stuID" placeholder="Student ID">
<input type="text" id="stuName" placeholder="Full Name">
<input type="text" id="secretCodeInput" placeholder="Enter Code for THIS class">
<button class="main" id="markBtn" onclick="markAttendance()">Mark Present</button>
<p id="message" style="text-align:center;font-weight:bold"></p>
<p class="small">Your phone is locked to ONE Year only</p>
</div>
</div>
</div>

<script>
const TEACHER_PASSWORD="imatt2026"; const DURATION=15;
let selectedDept="", selectedYear="";
function teacherLogin(){
 if(document.getElementById('teacherPass').value===TEACHER_PASSWORD){
  localStorage.setItem('imatt_teacher_logged','yes');
  document.getElementById('teacherLogin').classList.add('hidden');
  document.getElementById('teacherPanel').classList.remove('hidden');
 } else alert('Wrong Password');
}
function teacherLogout(){localStorage.removeItem('imatt_teacher_logged'); location.reload();}
function getProfile(){ return JSON.parse(localStorage.getItem('imatt_student_profile')||'null'); }
function selectDept(d){
 let profile=getProfile();
 if(profile && profile.dept!==d && localStorage.getItem('imatt_teacher_logged')!=='yes'){
   alert('❌ This phone is LOCKED to '+profile.dept+'\nYou cannot access '+d+'\nContact Admin to reset.');
   return;
 }
 selectedDept=d;
 document.getElementById('stepDept').classList.add('hidden');
 document.getElementById('stepYear').classList.remove('hidden');
 document.getElementById('deptNameShow').innerText=d;
 checkYearLock();
}
function backToDept(){document.getElementById('stepYear').classList.add('hidden'); document.getElementById('stepDept').classList.remove('hidden');}
function checkYearLock(){
 let profile=getProfile();
 let warn=document.getElementById('yearLockWarning');
 if(profile && localStorage.getItem('imatt_teacher_logged')!=='yes'){
   warn.innerHTML='<div class="lock-box">🔒 Your phone is locked to: '+profile.dept+' '+profile.year+'<br>You can ONLY mark for this Year!</div>';
   // Disable other years visually
   document.getElementById('btnY1').style.opacity = profile.year==='Year 1'?'1':'0.3';
   document.getElementById('btnY2').style.opacity = profile.year==='Year 2'?'1':'0.3';
   document.getElementById('btnY3').style.opacity = profile.year==='Year 3'?'1':'0.3';
   document.getElementById('btnY4').style.opacity = profile.year==='Final Year'?'1':'0.3';
 } else { warn.innerHTML=''; }
}
function selectYear(y){
 let profile=getProfile();
 if(profile && localStorage.getItem('imatt_teacher_logged')!=='yes'){
   if(profile.year!==y || profile.dept!==selectedDept){
     alert('❌ ACCESS DENIED!\nThis phone is registered to:\n'+profile.dept+' '+profile.year+'\nYou cannot mark for:\n'+selectedDept+' '+y);
     return;
   }
 }
 selectedYear=y;
 document.getElementById('stepYear').classList.add('hidden');
 document.getElementById('stepAttendance').classList.remove('hidden');
 document.getElementById('finalDept').innerText=selectedDept;
 document.getElementById('finalYear').innerText=selectedYear;
 document.getElementById('teachingInfo').innerText=selectedDept+' '+selectedYear;
 document.getElementById('codeDeptYear').innerText=selectedDept+' '+selectedYear;
 if(profile){
   document.getElementById('stuID').value=profile.id;
   document.getElementById('stuName').value=profile.name;
 }
 showCode(); startTimer(); updateCounts();
}
function backToYear(){document.getElementById('stepAttendance').classList.add('hidden'); document.getElementById('stepYear').classList.remove('hidden');}
function getKey(type){ return type+'_'+selectedDept+'_'+selectedYear; }
function generateCode(){
 const code='IMATT-'+Math.random().toString(36).substring(2,6).toUpperCase();
 const expiry=Date.now()+DURATION*60*1000;
 localStorage.setItem(getKey('imatt_code'), code);
 localStorage.setItem(getKey('imatt_expiry'), expiry);
 document.getElementById('todayCode').innerText=code;
 alert('CODE for '+selectedDept+' '+selectedYear+': '+code);
 startTimer();
}
function showCode(){
 if(!selectedDept||!selectedYear) return;
 let c=localStorage.getItem(getKey('imatt_code'));
 document.getElementById('todayCode').innerText=c?c:'Not Generated';
}
function startTimer(){
 setInterval(()=>{
  if(!selectedDept||!selectedYear) return;
  let expiry=localStorage.getItem(getKey('imatt_expiry'));
  if(!expiry){document.getElementById('timer').innerText='--:--'; return;}
  let diff=expiry-Date.now();
  if(diff<=0){
   document.getElementById('timer').innerText='CLOSED';
   document.getElementById('markBtn').disabled=true;
   document.getElementById('markBtn').innerText='⛔ Closed';
   document.getElementById('markBtn').style.background='red';
  } else {
   let m=Math.floor(diff/60000), s=Math.floor((diff%60000)/1000);
   document.getElementById('timer').innerText=m+':'+(s<10?'0':'')+s;
  }
 },1000);
}
function markAttendance(){
 let expiry=localStorage.getItem(getKey('imatt_expiry'));
 if(!expiry){alert('Lecturer has not started this class'); return;}
 if(Date.now()>expiry){alert('Attendance CLOSED'); return;}
 let id=document.getElementById('stuID').value.trim();
 let name=document.getElementById('stuName').value.trim();
 let entered=document.getElementById('secretCodeInput').value.trim().toUpperCase();
 let real=localStorage.getItem(getKey('imatt_code'));
 let today=new Date().toISOString().split('T')[0];
 if(!id||!name){alert('Enter ID and Name'); return;}
 if(entered!==real){alert('Wrong Code for '+selectedDept+' '+selectedYear); return;}

 let profile=getProfile();
 if(!profile){
   // FIRST TIME - LOCK THIS PHONE TO THIS DEPT & YEAR
   localStorage.setItem('imatt_student_profile', JSON.stringify({id:id, name:name, dept:selectedDept, year:selectedYear}));
   alert('✅ Your phone is now LOCKED to:\n'+selectedDept+' '+selectedYear+'\nYou cannot mark for other Year again!');
 } else {
   // ALREADY LOCKED - CHECK
   if(profile.dept!==selectedDept || profile.year!==selectedYear){
     alert('❌ You are locked to '+profile.dept+' '+profile.year+'\nCannot mark for '+selectedDept+' '+selectedYear);
     return;
   }
 }

 let phoneKey='phone_'+today+'_'+selectedDept+'_'+selectedYear;
 if(localStorage.getItem(phoneKey)){document.getElementById('message').innerText='❌ Already used today'; return;}
 let key='records_'+selectedDept+'_'+selectedYear;
 let records=JSON.parse(localStorage.getItem(key)||'{}');
 if(!records[today]) records[today]={};
 if(records[today][id]){document.getElementById('message').innerText='❌ Already marked'; return;}
 records[today][id]={name:name, time:new Date().toLocaleTimeString()};
 localStorage.setItem(key, JSON.stringify(records));
 localStorage.setItem(phoneKey, name);
 document.getElementById('message').innerText='✅ Present for '+selectedDept+' '+selectedYear;
 updateCounts();
 document.getElementById('secretCodeInput').value='';
}
function updateCounts(){
 if(!selectedDept||!selectedYear) return;
 let today=new Date().toISOString().split('T')[0];
 let key='records_'+selectedDept+'_'+selectedYear;
 let records=JSON.parse(localStorage.getItem(key)||'{}');
 let data=records[today]||{};
 document.getElementById('presentCount').innerText=Object.keys(data).length;
 let html=''; for(let id in data){ html+=`<div>${id} - ${data[id].name}</div>`; }
 document.getElementById('todayList').innerHTML=html;
 // Show lock info on main page
 let profile=getProfile();
 if(profile && localStorage.getItem('imatt_teacher_logged')!=='yes'){
   document.getElementById('studentLockInfo').innerHTML='<div class="lock-box" style="margin-top:10px">🔒 Locked: '+profile.dept+' '+profile.year+'<br>'+profile.name+' ('+profile.id+')</div>';
 }
}
function exportExcel(){
 let today=new Date().toISOString().split('T')[0];
 let key='records_'+selectedDept+'_'+selectedYear;
 let records=JSON.parse(localStorage.getItem(key)||'{}');
 let data=records[today]; if(!data){alert('No data'); return;}
 let csv='ID,Name,Time,Dept,Year\n';
 for(let id in data){ csv+=id+','+data[id].name+','+data[id].time+','+selectedDept+','+selectedYear+'\n'; }
 let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=selectedDept+'_'+selectedYear+'_'+today+'.csv'; a.click();
}
if(localStorage.getItem('imatt_teacher_logged')==='yes'){
 document.getElementById('teacherLogin').classList.add('hidden');
 document.getElementById('teacherPanel').classList.remove('hidden');
}
updateCounts();
</script>
</body>
</html>
