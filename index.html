<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMATT COLLEGE - Live Attendance</title>
<style>
body{background:#0a3d2e;font-family:Arial;margin:0;padding:10px}
.card{background:white;max-width:560px;margin:auto;border-radius:18px;padding:18px}
h1{color:#0a3d2e;text-align:center;margin:5px}
.sub{color:#8b0000;text-align:center;font-style:italic;font-weight:bold;font-size:13px}
.badge{background:#8b0000;color:white;padding:6px 14px;border-radius:20px;display:block;width:fit-content;margin:8px auto;font-size:11px}
.btn-back{background:#6c757d;color:white;border:none;padding:10px 15px;border-radius:20px;font-weight:bold}
.dept-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dept-btn{border:2px solid #0a3d2e;padding:13px;border-radius:12px;background:white;font-weight:bold;color:#0a3d2e}
.year-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.year-btn{padding:18px;border-radius:14px;border:none;color:white;font-weight:bold}
.y1{background:#1e3a8a}.y2{background:#0e9f6e}.y3{background:#d97706}.y4{background:#7c3aed}
input{width:100%;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #bbb;box-sizing:border-box}
button.main{background:#0a3d2e;color:white;padding:12px;border:none;border-radius:9px;font-weight:bold;width:100%;margin-top:6px}
.hidden{display:none}
.teacher-box{background:#e8f8f5;border:2px solid #0a3d2e;padding:12px;border-radius:10px;margin:12px 0}
.lock-box{background:#fff3cd;border:2px solid #ff9800;padding:10px;border-radius:10px;text-align:center;font-weight:bold;color:#856404;margin:8px 0}
.receipt{background:#d1fae5;border:2px solid #0e9f6e;padding:14px;border-radius:12px;margin-top:12px}
.student-info-box{background:#eef2ff;border:1px solid #6366f1;padding:10px;border-radius:10px;margin:8px 0;font-size:13px}
#todayCode{font-size:28px;color:red;font-weight:bold}
#timer{color:red;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h1>IMATT COLLEGE</h1>
<div class="sub">Education is the Source of Human Progress</div>
<div class="badge" id="dateDisplay"></div>
<div id="teacherLogin" style="background:#f1f1f1;padding:8px;border-radius:8px">
<input type="password" id="teacherPass" placeholder="Lecturer Password (imatt2026)">
<button class="main" onclick="teacherLogin()" style="background:#444">Login as Lecturer</button>
</div>
<div id="teacherPanel" class="hidden">
<div class="teacher-box">
<p style="text-align:center"><b>LECTURER: <span id="teachingInfo"></span></b><br>Module: <b id="teachingModule">-</b></p>
<input type="text" id="moduleInput" placeholder="Enter Module e.g. Networking">
<p>Code: <span id="todayCode">Not Generated</span><br>Time: <span id="timer">--:--</span></p>
<button class="main" onclick="generateCode()">Generate Code For ALL Phones (15 Min)</button>
<p>Present Live: <b id="presentCount">0</b></p>
<div id="todayList" style="font-size:13px;max-height:200px;overflow:auto"></div>
<button class="main" onclick="exportExcel()" style="background:#27ae60">Download Excel</button>
<button class="main" onclick="teacherLogout()" style="background:gray">Logout</button>
</div>
</div>
<div id="stepDept"><h2 style="text-align:center">SELECT DEPARTMENT</h2>
<div class="dept-grid">
<button class="dept-btn" onclick="selectDept('Law (LLB)')">Law (LLB)</button>
<button class="dept-btn" onclick="selectDept('Information Systems')">Info Systems</button>
<button class="dept-btn" onclick="selectDept('Business Administration')">Business Admin</button>
<button class="dept-btn" onclick="selectDept('Applied Accounting')">Accounting</button>
<button class="dept-btn" onclick="selectDept('Human Resource Mgt')">HRM</button>
<button class="dept-btn" onclick="selectDept('Procurement & Supply')">Procurement</button>
<button class="dept-btn" onclick="selectDept('Nursing (SRN)')">Nursing</button>
<button class="dept-btn" onclick="selectDept('Computer Science')">Computer Science</button>
</div><div id="studentLockInfo"></div></div>
<div id="stepYear" class="hidden">
<button class="btn-back" onclick="backToDept()">← Back</button>
<div style="background:#e6f4ea;padding:10px;border-radius:8px;text-align:center;margin:10px 0;font-weight:bold" id="deptNameShow"></div>
<h2 style="text-align:center">SELECT YEAR</h2><div id="yearLockWarning"></div>
<div class="year-grid">
<button class="year-btn y1" onclick="selectYear('Year 1')">Year 1</button>
<button class="year-btn y2" onclick="selectYear('Year 2')">Year 2</button>
<button class="year-btn y3" onclick="selectYear('Year 3')">Year 3</button>
<button class="year-btn y4" onclick="selectYear('Final Year')">Final Year</button>
</div></div>
<div id="stepAttendance" class="hidden">
<button class="btn-back" onclick="backToYear()">← Back</button>
<h3 style="text-align:center"><span id="finalDept"></span> - <span id="finalYear"></span></h3>
<div class="student-info-box">
Module: <b id="showModuleStudent">Waiting...</b><br>
Date: <b id="showDateStudent"></b><br>
Time: <b id="showTimeStudent"></b><br>
Code Status: <b id="codeStatus">Checking...</b>
</div>
<div id="studentForm">
<input type="text" id="stuID" placeholder="ID e.g. 1727">
<input type="text" id="stuName" placeholder="Name e.g. Issa Koroma">
<input type="text" id="secretCodeInput" placeholder="Code from Board">
<button class="main" id="markBtn" onclick="markAttendance()">Mark Present</button>
<p id="message" style="text-align:center;font-weight:bold"></p>
<div id="receiptBox"></div>
</div></div></div>
<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyBbfZkPmrPyEAkpaaAG5DPb4tk7k30ILPU",
  authDomain: "imatt---attendance.firebaseapp.com",
  databaseURL: "https://imatt---attendance-default-rtdb.firebaseio.com",
  projectId: "imatt---attendance",
  storageBucket: "imatt---attendance.firebasestorage.app",
  messagingSenderId: "774914670268",
  appId: "1:774914670268:web:b74a5749c382bfa33e5ab9"
};
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const TEACHER_PASSWORD="imatt2026"; const DURATION=15;
let selectedDept="", selectedYear="", timerInterval=null, currentCodeData=null;
window.selectDept=selectDept; window.selectYear=selectYear; window.backToDept=backToDept; window.backToYear=backToYear;
window.teacherLogin=teacherLogin; window.teacherLogout=teacherLogout; window.generateCode=generateCode; window.markAttendance=markAttendance; window.exportExcel=exportExcel;
function updateDateTime(){let now=new Date();document.getElementById('dateDisplay').innerText=now.toLocaleString('en-GB');let d=document.getElementById('showDateStudent');if(d)d.innerText=now.toLocaleDateString('en-GB');let t=document.getElementById('showTimeStudent');if(t)t.innerText=now.toLocaleTimeString();}
setInterval(updateDateTime,1000);updateDateTime();
function getProfile(){return JSON.parse(localStorage.getItem('imatt_student_profile')||'null');}
function teacherLogin(){if(document.getElementById('teacherPass').value===TEACHER_PASSWORD){localStorage.setItem('imatt_teacher_logged','yes');document.getElementById('teacherLogin').classList.add('hidden');document.getElementById('teacherPanel').classList.remove('hidden');if(selectedDept&&selectedYear)loadCodeFromFirebase();}else alert('Wrong Password');}
function teacherLogout(){localStorage.removeItem('imatt_teacher_logged');location.reload();}
function selectDept(d){let p=getProfile();if(p&&p.dept!==d&&localStorage.getItem('imatt_teacher_logged')!=='yes'){alert('❌ Locked to '+p.dept);return;}selectedDept=d;document.getElementById('stepDept').classList.add('hidden');document.getElementById('stepYear').classList.remove('hidden');document.getElementById('deptNameShow').innerText=d;checkYearLock();}
function backToDept(){document.getElementById('stepYear').classList.add('hidden');document.getElementById('stepDept').classList.remove('hidden');}
function checkYearLock(){let p=getProfile();let w=document.getElementById('yearLockWarning');if(p&&localStorage.getItem('imatt_teacher_logged')!=='yes'){w.innerHTML='<div class="lock-box">🔒 Locked to: '+p.dept+' '+p.year+'</div>';}else w.innerHTML='';}
function selectYear(y){let p=getProfile();if(p&&localStorage.getItem('imatt_teacher_logged')!=='yes'){if(p.year!==y||p.dept!==selectedDept){alert('❌ Locked to '+p.dept+' '+p.year);return;}}selectedYear=y;document.getElementById('stepYear').classList.add('hidden');document.getElementById('stepAttendance').classList.remove('hidden');document.getElementById('finalDept').innerText=selectedDept;document.getElementById('finalYear').innerText=selectedYear;document.getElementById('teachingInfo').innerText=selectedDept+' '+selectedYear;if(p){document.getElementById('stuID').value=p.id;document.getElementById('stuName').value=p.name;}loadCodeFromFirebase();listenAttendance();}
function backToYear(){document.getElementById('stepAttendance').classList.add('hidden');document.getElementById('stepYear').classList.remove('hidden');}
function getCodePath(){return `codes/${selectedDept}/${selectedYear}`;}
function getAttendancePath(){let today=new Date().toISOString().split('T')[0];return `attendance/${selectedDept}/${selectedYear}/${today}`;}
async function generateCode(){let mod=document.getElementById('moduleInput').value.trim();if(!mod){alert('Enter Module!');return;}let code='IMATT-'+Math.random().toString(36).substring(2,6).toUpperCase();let expiry=Date.now()+DURATION*60*1000;let data={code:code,expiry:expiry,module:mod,date:new Date().toLocaleDateString('en-GB')};await set(ref(db,getCodePath()),data);alert(`CODE FOR ALL PHONES!\n${selectedDept} ${selectedYear}\nModule: ${mod}\nCODE: ${code}`);}
function loadCodeFromFirebase(){let codeRef=ref(db,getCodePath());onValue(codeRef,(snap)=>{let data=snap.val();if(!data){document.getElementById('todayCode').innerText='Not Generated';document.getElementById('showModuleStudent').innerText='Waiting for lecturer...';document.getElementById('codeStatus').innerText='No code yet';return;}currentCodeData=data;document.getElementById('todayCode').innerText=data.code;document.getElementById('teachingModule').innerText=data.module;document.getElementById('showModuleStudent').innerText=data.module;startTimer(data.expiry);});}
function startTimer(expiry){if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(()=>{let diff=expiry-Date.now();if(diff<=0){document.getElementById('timer').innerText='CLOSED';document.getElementById('codeStatus').innerText='⛔ Closed';document.getElementById('markBtn').disabled=true;document.getElementById('markBtn').innerText='⛔ Closed';document.getElementById('markBtn').style.background='red';}else{let m=Math.floor(diff/60000),s=Math.floor((diff%60000)/1000);document.getElementById('timer').innerText=m+':'+(s<10?'0':'')+s;document.getElementById('codeStatus').innerText='✅ Open - '+m+'m '+s+'s left';document.getElementById('markBtn').disabled=false;document.getElementById('markBtn').innerText='Mark Present';document.getElementById('markBtn').style.background='#0a3d2e';}},1000);}
async function markAttendance(){let id=document.getElementById('stuID').value.trim();let name=document.getElementById('stuName').value.trim();let entered=document.getElementById('secretCodeInput').value.trim().toUpperCase();if(!id||!name){alert('Enter ID and Name');return;}if(!currentCodeData){alert('Lecturer has not started - Wait');return;}if(Date.now()>currentCodeData.expiry){alert('Time finished');return;}if(entered!==currentCodeData.code){alert(`Wrong Code! Expected ${currentCodeData.code}`);return;}let profile=getProfile();if(!profile){localStorage.setItem('imatt_student_profile',JSON.stringify({id:id,name:name,dept:selectedDept,year:selectedYear}));}else if(profile.dept!==selectedDept||profile.year!==selectedYear){alert('Locked to '+profile.dept+' '+profile.year);return;}let attRef=ref(db,getAttendancePath()+'/'+id);let snap=await get(attRef);if(snap.exists()){document.getElementById('message').innerText='❌ Already marked today';return;}let now=new Date();let dateStr=now.toLocaleDateString('en-GB');let timeStr=now.toLocaleTimeString();let record={id:id,name:name,dept:selectedDept,year:selectedYear,module:currentCodeData.module,date:dateStr,time:timeStr,timestamp:Date.now()};await set(attRef,record);document.getElementById('message').innerText='✅ Present!';document.getElementById('receiptBox').innerHTML=`<div class="receipt"><b>✅ CONFIRMED</b><br><br>${name} ${id} opening system ${dateStr} ${timeStr} present for Today class<br><br>Dept: <b>${selectedDept}</b><br>Year: <b>${selectedYear}</b><br>Module: <b>${currentCodeData.module}</b><br>Date: <b>${dateStr}</b><br>Time: <b>${timeStr}</b><br>Status: <b style="color:green">Present ✔ Live to Firebase</b></div>`;}
function listenAttendance(){let attPath=ref(db,getAttendancePath());onValue(attPath,(snap)=>{let data=snap.val()||{};document.getElementById('presentCount').innerText=Object.keys(data).length;let html='';for(let k in data){let r=data[k];html+=`<div>${r.id} - ${r.name} - ${r.module} - ${r.time}</div>`;}document.getElementById('todayList').innerHTML=html||'No students yet';});}
async function exportExcel(){let snap=await get(ref(db,getAttendancePath()));let data=snap.val();if(!data){alert('No data today');return;}let csv='ID,Name,Department,Year,Module,Date,Time,Status\n';for(let k in data){let r=data[k];csv+=`${r.id},${r.name},${r.dept},${r.year},${r.module},${r.date},${r.time},Present\n`;}let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${selectedDept}_${selectedYear}_${new Date().toISOString().split('T')[0]}.csv`;a.click();}
if(localStorage.getItem('imatt_teacher_logged')==='yes'){document.getElementById('teacherLogin').classList.add('hidden');document.getElementById('teacherPanel').classList.remove('hidden');}
let p=getProfile();if(p){document.getElementById('studentLockInfo').innerHTML=`<div class="lock-box">🔒 Locked: ${p.dept} ${p.year}<br>${p.name} (${p.id})</div>`;}
</script>
</body>
</html>
