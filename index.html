<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imatt College - Attendance</title>
<style>
body{font-family:Arial;background:#f4f6fb;margin:0;padding:12px}
.card{background:#fff;border-radius:15px;padding:16px;max-width:750px;margin:auto;box-shadow:0 5px 15px #0001}
h2{text-align:center;margin:0;color:#1e40af}.sub{text-align:center;color:#666;font-size:13px;margin-bottom:6px}
input,select{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box;font-size:15px}
button{width:100%;padding:13px;border:none;border-radius:10px;background:#1e40af;color:#fff;font-weight:bold;margin-top:7px;font-size:15px}
.wrap{overflow-x:auto}
table{width:100%;margin-top:14px;border-collapse:collapse;font-size:13px;min-width:650px} th,td{border-bottom:1px solid #eee;padding:9px;text-align:center}
th{background:#1e40af;color:#fff;position:sticky;top:0}
.statusBtn{font-weight:bold;color:#1e40af;cursor:pointer;padding:6px 12px;border-radius:20px;border:1.5px solid #1e40af;background:#dbeafe;display:inline-block}
.statusBtn.absent{color:#991b1b;border-color:#991b1b;background:#fee2e2}
.countBox{display:flex;justify-content:space-around;margin-top:15px;background:#eef2ff;padding:12px;border-radius:12px;font-weight:bold;font-size:15px;text-align:center}
.countBox span{font-size:18px}
.presentC{color:#16a34a}.absentC{color:#dc2626}.totalC{color:#1e40af}
</style>
</head>
<body>
<div class="card">
<h2>Imatt College</h2>
<div class="sub" id="date"></div>
<div class="sub">By Issa Koroma - Final System</div>

<input id="sid" placeholder="Student ID e.g. 1727">
<input id="sname" placeholder="Student Full Name">
<select id="year"><option>Year 1</option><option>Year 2</option><option>Year 3</option><option>Year 4</option></select>
<input id="course" placeholder="Course/Module e.g. Critical Thinking">
<select id="defaultStatus"><option>Present</option><option>Absent</option></select>

<button onclick="addStudent()">Mark Attendance</button>
<button onclick="downloadCSV()" style="background:#16a34a">Export to Excel</button>
<button onclick="clearAll()" style="background:#64748b">Clear All</button>

<!-- COUNTER BOX ADDED HERE -->
<div class="countBox">
<div>Present<br><span class="presentC" id="presentCount">0</span></div>
<div>Absent<br><span class="absentC" id="absentCount">0</span></div>
<div>Total<br><span class="totalC" id="totalCount">0</span></div>
</div>

<div class="wrap">
<table>
<thead><tr><th>Year</th><th>ID</th><th>Name</th><th>Module</th><th>Status</th><th>Time</th><th>Del</th></tr></thead>
<tbody id="list"></tbody>
</table>
</div>

<div style="text-align:center;margin-top:10px;font-size:12px;color:#666">Tap Present/Absent to change - time shows for both</div>
</div>

<script>
document.getElementById('date').innerText=new Date().toDateString();
let roster=JSON.parse(localStorage.getItem('imatt_final_v5')||'[]');

function save(){localStorage.setItem('imatt_final_v5',JSON.stringify(roster)); render();}

function addStudent(){
 let id=sid.value.trim(), name=sname.value.trim(), yr=year.value, mod=course.value.trim(), st=defaultStatus.value;
 if(!id||!name||!mod){alert("Please fill ID, Name, Module");return}
 roster.push({id:id,name:name,year:yr,module:mod,status:st,time:new Date().toLocaleTimeString()});
 save(); sid.value=""; sname.value=""; course.value="";
}

function render(){
 list.innerHTML="";
 let present=0, absent=0;
 roster.forEach((s,i)=>{
   if(s.status==="Present") present++; else absent++;
   let btnClass = s.status==="Present"?"statusBtn":"statusBtn absent";
   list.innerHTML+=`<tr><td>${s.year}</td><td>${s.id}</td><td style="text-align:left">${s.name}</td><td style="text-align:left">${s.module}</td><td><span class="${btnClass}" onclick="toggleStatus(${i})">${s.status}</span></td><td>${s.time}</td><td><button onclick="del(${i})" style="background:#ef4444;padding:6px 9px;width:auto;font-size:12px">X</button></td></tr>`;
 });
 document.getElementById('presentCount').innerText=present;
 document.getElementById('absentCount').innerText=absent;
 document.getElementById('totalCount').innerText=roster.length;
}

function toggleStatus(i){
 if(roster[i].status==="Present"){roster[i].status="Absent";}
 else {roster[i].status="Present";}
 roster[i].time=new Date().toLocaleTimeString();
 save();
}

function del(i){roster.splice(i,1);save();}
function clearAll(){if(confirm("Clear all attendance?")){roster=[];save();}}
function downloadCSV(){
 let csv="Year,ID,Name,Module,Status,Time,Date\n";
 roster.forEach(s=>{csv+=`"${s.year}","${s.id}","${s.name}","${s.module}","${s.status}","${s.time}","${new Date().toDateString()}"\n`;});
 let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download="Imatt_"+new Date().toDateString()+".csv";a.click();
}
render();
</script>
</body>
</html>
