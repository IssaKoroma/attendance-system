<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMATT COLLEGE ATTENDANCE</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a3d24;min-height:100vh;padding:12px}
.header{text-align:center;color:white;font-weight:bold;font-size:20px;margin:10px 0}
.login-box{background:#e6f4ea;border-radius:25px;padding:35px 20px;text-align:center;margin-top:70px}
.login-box h2{color:#0a3d24;font-size:28px;font-weight:900;line-height:1.2}
.login-box p{font-size:14px;margin:10px 0 15px}
.input-old{width:100%;padding:15px;border-radius:15px;border:2px solid #c8c8c8;background:white;font-size:16px;margin-bottom:12px}
.btn-login{background:#00c853;color:white;width:100%;padding:16px;border-radius:15px;border:none;font-weight:bold;font-size:18px;cursor:pointer}
.top-card{background:#e6f4ea;border-radius:20px;display:flex;justify-content:space-around;padding:14px;margin:10px 0;text-align:center;border:3px solid white}
.top-card div{font-weight:bold;font-size:12px}
.top-card span{display:block;font-size:19px;margin-top:3px}
.btn-dark{background:#0a3d24;border:3px solid white;color:white;width:100%;padding:14px;border-radius:15px;font-weight:bold;font-size:14px;margin:7px 0;cursor:pointer}
.code-box{background:#0a3d24;border:3px solid white;color:white;width:100%;padding:14px;border-radius:15px;font-weight:bold;font-size:38px;letter-spacing:10px;text-align:center;margin:7px 0}
.timer{text-align:center;color:#ff3b3b;font-weight:bold;font-size:15px;margin:4px 0}
.input-box{width:100%;padding:12px;border-radius:15px;border:none;outline:none;font-size:13px;margin:5px 0;background:white}
.btn-green{background:#00c853;color:white;width:100%;padding:14px;border-radius:15px;font-weight:bold;font-size:15px;border:none;margin:7px 0;cursor:pointer}
.year-tabs{display:flex;gap:5px;margin:8px 0}
.year-tabs button{flex:1;padding:9px;border-radius:12px;border:2px solid white;background:#e6f4ea;font-weight:bold;cursor:pointer;font-size:12px}
.year-tabs button.active{background:#0a3d24;color:white}
.table-card{background:white;border-radius:16px;overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:10px;min-width:500px}
th{background:#0a3d24;color:white;padding:7px 4px;font-size:9px}
td{padding:7px 4px;text-align:center;border-bottom:1px solid #eee}
.badge-present{background:#00c853;color:white;padding:3px 6px;border-radius:10px;font-weight:bold;font-size:9px}
.footer{text-align:center;color:white;padding:15px;font-weight:bold;font-size:13px}
.role-badge{text-align:center;color:#00ff88;font-weight:bold;font-size:13px;margin-bottom:4px}
</style>
</head>
<body>

<div id="loginView">
<div class="login-box">
<h2>IMATT COLLEGE<br>ATTENDANCE</h2>
<p>Admin: issa1727 | Lecturer: imatt2026</p>
<input id="passInput" class="input-old" placeholder="Enter password" type="password">
<button class="btn-login" onclick="login()">LOGIN</button>
</div>
<div class="footer">Built and Design by Issa Koroma Year 2</div>
</div>

<div id="mainView" style="display:none">
<div class="header">IMATT COLLEGE ATTENDANCE</div>
<div id="roleView" class="role-badge"></div>

<div class="top-card">
<div>Present<br><span id="presentCount">0</span></div>
<div>Absent<br><span id="absentCount">0</span></div>
<div>Total<br><span id="totalCount">200</span></div>
</div>

<!-- ONLY ADMIN & LECTURER CAN SEE THIS -->
<div id="generateSection">
<button class="btn-dark" onclick="generateCode()">🔑 Generate Code - Only Lecturer & Admin Generate</button>
<div class="code-box" id="codeDisplay">----</div>
<div class="timer" id="timerDisplay">⏰ No Code Yet</div>
</div>

<select id="deptInput" class="input-box">
<optgroup label="DEGREE"><option>Bachelor of Laws (LLB)</option><option>BSc. in Information Systems</option><option>BSc. in Business Administration</option><option>BSc. in Applied Accounting</option><option>BSc. in Human Resource Management</option><option>BSc. in Procurement and Supply Chain Management</option><option>BSc. in Marketing</option></optgroup>
<optgroup label="DIPLOMA"><option>Diploma in Mass Communication</option><option>Higher Diploma in Nursing and Midwifery (SRN)</option><option>IELTS, French and Spanish Language</option><option selected>Diploma in Computer Science</option><option>Diploma in Business Administration</option><option>Diploma in Project Management</option><option>Diploma in Banking and Finance</option><option>Diploma in Human Resource Management</option><option>Diploma in Marketing</option><option>Diploma in Procurement and Supply Chain Management</option><option>Diploma in Applied Accounting</option></optgroup>
</select>

<div style="display:flex;gap:5px">
<select id="yearInput" class="input-box" style="flex:1"><option value="Y1">Year 1</option><option value="Y2" selected>Year 2</option><option value="Y3">Year 3</option><option value="Y4">Year 4</option></select>
<input id="moduleInput" class="input-box" style="flex:1" placeholder="Module: Operating System">
</div>

<!-- SEPARATED LIKE MODULE -->
<input id="nameInput" class="input-box" placeholder="Student Name e.g. Ibriham Koroma">
<div style="display:flex;gap:5px">
<input id="idInput" class="input-box" style="flex:1" placeholder="Student ID e.g. 1543">
<input id="phoneInput" class="input-box" style="flex:1" placeholder="Phone Number e.g. 076123456">
</div>

<button class="btn-green" onclick="importStudent()">📥 Import - Add to Lecturer/Admin List</button>

<div class="year-tabs">
<button id="btnALL" onclick="filterYear('ALL')" class="active">ALL</button>
<button id="btnY1" onclick="filterYear('Y1')">Y1</button>
<button id="btnY2" onclick="filterYear('Y2')">Y2</button>
<button id="btnY3" onclick="filterYear('Y3')">Y3</button>
<button id="btnY4" onclick="filterYear('Y4')">Y4</button>
</div>

<select id="deptFilter" class="input-box" onchange="filterDept(this.value)">
<option value="ALL">ALL Departments</option>
<option>Diploma in Computer Science</option><option>BSc. in Information Systems</option><option>BSc. in Business Administration</option><option>Bachelor of Laws (LLB)</option><option>Diploma in Business Administration</option><option>Diploma in Banking and Finance</option><option>Diploma in Applied Accounting</option><option>Diploma in Marketing</option><option>BSc. in Marketing</option><option>Diploma in Mass Communication</option><option>Higher Diploma in Nursing and Midwifery (SRN)</option><option>IELTS, French and Spanish Language</option><option>Diploma in Project Management</option><option>Diploma in Human Resource Management</option><option>BSc. in Human Resource Management</option><option>Diploma in Procurement and Supply Chain Management</option><option>BSc. in Procurement and Supply Chain Management</option><option>BSc. in Applied Accounting</option>
</select>

<div class="table-card">
<table>
<thead><tr><th>Year</th><th>Name</th><th>ID</th><th>Phone</th><th>Dept/Module</th><th>Status</th><th>❌</th></tr></thead>
<tbody id="attendanceBody"></tbody>
</table>
</div>

<button class="btn-green" onclick="downloadExcel()">📥 Download Excel - Present + Absent</button>
<button class="btn-dark" style="background:#c62828" onclick="clearAll()">Clear ALL</button>
<div class="footer">Built and Design by Issa Koroma Year 2</div>
</div>

<script>
const ALL_STUDENTS=[{year:"Y2",dept:"Diploma in Computer Science",name:"Ibriham Koroma",id:"1543"}];
for(let i=1500;i<1699;i++){ if(i==1543) continue; if(ALL_STUDENTS.length>=200) break; ALL_STUDENTS.push({year:"Y2",dept:"Diploma in Computer Science",name:"Student "+i,id:String(i)}); }
let currentCode="",expiry=0,timerInt=null,role="lecturer",selectedYear="ALL",selectedDept="ALL";
let data=JSON.parse(localStorage.getItem("imatt_attendance")||"[]");

function login(){
 let p=document.getElementById("passInput").value.trim();
 if(p==="issa1727") role="admin"; else if(p==="imatt2026") role="lecturer"; else {alert("Wrong Password");return;}
 document.getElementById("loginView").style.display="none"; document.getElementById("mainView").style.display="block";
 document.getElementById("roleView").innerText= role==="admin" ? "👑 ADMIN VIEW - Can Generate Code" : "👨‍🏫 LECTURER VIEW - Can Generate Code";
 // Only Admin & Lecturer can generate - show section
 document.getElementById("generateSection").style.display="block";
 render();
}
function generateCode(){
 if(role!=="admin" && role!=="lecturer"){ alert("Only Admin & Lecturer can generate code!"); return; }
 currentCode=Math.floor(1000+Math.random()*9000).toString(); expiry=Date.now()+7*60*1000;
 localStorage.setItem("imatt_code",currentCode); localStorage.setItem("imatt_expiry",expiry);
 document.getElementById("codeDisplay").innerText=currentCode.split("").join(" "); startTimer();
}
function startTimer(){ clearInterval(timerInt); timerInt=setInterval(()=>{ let diff=expiry-Date.now(); if(diff<=0){document.getElementById("timerDisplay").innerText="⏰ Expired";clearInterval(timerInt);return;} let m=Math.floor(diff/60000); let s=Math.floor((diff%60000)/1000); document.getElementById("timerDisplay").innerHTML=`⏰ ${m}m ${s}s - Code: ${currentCode}`; },1000); }

function importStudent(){
 let dept=document.getElementById("deptInput").value; let year=document.getElementById("yearInput").value;
 let module=document.getElementById("moduleInput").value.trim()||"Operating System";
 let name=document.getElementById("nameInput").value.trim();
 let id=document.getElementById("idInput").value.trim().replace(/\D/g,"");
 let phone=document.getElementById("phoneInput").value.trim();

 if(!name){alert("Enter Student Name");return;}
 if(!id){alert("Enter Student ID");return;}
 if(!phone){alert("Enter Phone Number");return;}

 let existing=data.find(x=>String(x.id)===String(id));
 if(existing){ alert(`❌ ID ${id} already registered under ${existing.dept} ${existing.year} as ${existing.name}! One ID = One Year only.`); return; }

 let now=new Date(); let d=`${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`; let t=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
 data.push({year,dept,name,id,phone,module,date:d,time:t,status:"Present"});
 localStorage.setItem("imatt_attendance",JSON.stringify(data));
 document.getElementById("nameInput").value=""; document.getElementById("idInput").value=""; document.getElementById("phoneInput").value="";
 filterYear(year); document.getElementById("deptFilter").value=dept; filterDept(dept);
}
function filterYear(y){ selectedYear=y; document.querySelectorAll(".year-tabs button").forEach(b=>b.classList.remove("active")); document.getElementById("btn"+y).classList.add("active"); render(); }
function filterDept(d){ selectedDept=d; render(); }
function getFiltered(){ let f=data; if(selectedYear!=="ALL") f=f.filter(r=>r.year===selectedYear); if(selectedDept!=="ALL") f=f.filter(r=>r.dept===selectedDept); return f; }
function render(){
 let body=document.getElementById("attendanceBody"); body.innerHTML=""; let filtered=getFiltered();
 filtered.forEach(r=>{ let realIndex=data.indexOf(r); body.innerHTML+=`<tr><td>${r.year}</td><td><b>${r.name}</b></td><td>${r.id}</td><td>${r.phone||'-'}</td><td><small>${r.dept}</small><br>${r.module}</td><td><span class="badge-present">${r.status}</span><br>${r.date}<br>${r.time}</td><td><span class="del" onclick="delRow(${realIndex})">❌</span></td></tr>`; });
 document.getElementById("presentCount").innerText=filtered.length; document.getElementById("totalCount").innerText=ALL_STUDENTS.length; document.getElementById("absentCount").innerText=ALL_STUDENTS.length - data.length;
}
function delRow(i){ if(confirm("Delete?")){ data.splice(i,1); localStorage.setItem("imatt_attendance",JSON.stringify(data)); render(); } }
function clearAll(){ if(confirm("Clear ALL?")){ data=[]; localStorage.setItem("imatt_attendance",JSON.stringify(data)); render(); } }
function downloadExcel(){
 let filtered=getFiltered(); if(filtered.length===0){alert("No data");return;}
 let presentSheet=[["Year","Name","ID","Phone","Department","Module","Status","Date","Time"]];
 filtered.forEach(r=>presentSheet.push([r.year,r.name,r.id,r.phone||"",r.dept,r.module,r.status,r.date,r.time]));
 let presentIds=data.map(x=>String(x.id)); let absentList=ALL_STUDENTS.filter(s=>!presentIds.includes(String(s.id)));
 let absentSheet=[["Year","Department","Name","ID","Status"]]; absentList.forEach(s=>absentSheet.push([s.year,s.dept,s.name,s.id,"Absent"]));
 let wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(presentSheet),"Present"); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(absentSheet),"Absent"); XLSX.writeFile(wb,`IMATT_${selectedDept}_${selectedYear}.xlsx`);
}
</script>
</body>
</html>
