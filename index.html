<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imatt College - Lecturer Panel</title>
<style>
body{font-family:Arial;background:#f4f6fb;margin:0;padding:15px}
.card{background:#fff;border-radius:15px;padding:18px;max-width:500px;margin:auto;box-shadow:0 5px 15px #0001}
h2{text-align:center;margin:0}.sub{text-align:center;color:#666;font-size:13px;margin-bottom:8px}
input,select{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}
button{width:100%;padding:12px;border:none;border-radius:10px;background:#1e40af;color:#fff;font-weight:bold;margin-top:6px;cursor:pointer}
.row{display:flex;gap:6px}.row button{flex:1}
.presentBtn{background:#16a34a}.absentBtn{background:#ef4444}.small{padding:7px;font-size:13px}
table{width:100%;margin-top:12px;border-collapse:collapse;font-size:13px} th,td{border-bottom:1px solid #eee;padding:7px;text-align:left}
.badge{padding:3px 8px;border-radius:20px;font-size:11px}.yes{background:#dcfce7;color:#166534}.no{background:#fee2e2;color:#991b1b}
.login-box{background:#fff7ed;border:1px dashed #f59e0b;padding:12px;border-radius:10px;text-align:center}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<h2>Imatt College</h2>
<div class="sub">Lecturer Master List - by Issa Koroma</div>
<div class="sub" id="date"></div>

<!-- LECTURER LOGIN FIRST -->
<div id="loginView">
<div class="login-box">
<b>🔐 Lecturer Login Required</b><br>
<input id="pass" type="password" placeholder="Enter Password">
<button onclick="login()">Unlock System</button>
<p style="font-size:11px;color:#666">Default: Imatt2026</p>
</div>
</div>

<!-- MAIN SYSTEM - ONLY AFTER LOGIN -->
<div id="mainView" class="hidden">
<div class="row">
<div style="flex:1;background:#dbeafe;color:#1e40af;padding:8px;border-radius:10px;text-align:center;font-weight:bold" id="pCount">Present: 0</div>
<div style="flex:1;background:#fee2e2;color:#991b1b;padding:8px;border-radius:10px;text-align:center;font-weight:bold" id="aCount">Absent: 0</div>
<div style="flex:1;background:#f1f5f9;padding:8px;border-radius:10px;text-align:center;font-weight:bold" id="tCount">Total: 0</div>
</div>

<h3 style="margin:15px 0 5px 0">1. Add Students (Once Only)</h3>
<input id="sid" placeholder="Student ID e.g. 1727">
<input id="sname" placeholder="Full Name">
<div class="row"><select id="year"><option>Year 1</option><option>Year 2</option><option>Year 3</option><option>Year 4</option></select><input id="course" placeholder="Module e.g. Networking"></div>
<button onclick="addStudent()">+ Add To Master List</button>

<h3 style="margin:15px 0 5px 0">2. Today's Attendance - Just Change Status</h3>
<table><thead><tr><th>Student</th><th>Status</th><th>Action</th></tr></thead><tbody id="list"></tbody></table>

<button onclick="downloadCSV()" style="background:#16a34a">📥 Download Today's Sheet (Excel)</button>
<button onclick="resetDay()" style="background:#64748b">🔄 Reset Today to All Absent</button>
<button onclick="clearRoster()" style="background:#ef4444">🗑️ Delete All Students (Master List)</button>
<button onclick="logout()" style="background:#f59e0b">🔒 Lock System</button>
</div>
</div>

<script>
document.getElementById('date').innerText = new Date().toDateString();
let roster = JSON.parse(localStorage.getItem('imatt_roster')||'[]');
let att = JSON.parse(localStorage.getItem('imatt_today_'+new Date().toDateString())||'{}');

function login(){
 if(document.getElementById('pass').value==="Imatt2026"){
   loginView.classList.add('hidden'); mainView.classList.remove('hidden'); render();
 } else alert("Wrong password - Only Lecturer");
}
function logout(){ mainView.classList.add('hidden'); loginView.classList.remove('hidden'); document.getElementById('pass').value=""; }
function saveRoster(){ localStorage.setItem('imatt_roster', JSON.stringify(roster)); }
function saveAtt(){ localStorage.setItem('imatt_today_'+new Date().toDateString(), JSON.stringify(att)); }

function addStudent(){
 let id=sid.value.trim(), name=sname.value.trim(), yr=year.value, cr=course.value.trim();
 if(!id||!name||!cr){alert("Fill ID, Name, Module"); return}
 if(roster.find(s=>s.id===id)){alert("ID already exists"); return}
 roster.push({id,name,year:yr,course:cr});
 saveRoster(); sid.value=""; sname.value=""; course.value="";
 if(!att[id]) att[id]={status:"Absent", time:"-"};
 saveAtt(); render();
}

function render(){
 list.innerHTML="";
 let present=0;
 roster.forEach(s=>{
   let status = att[s.id]?.status || "Absent";
   let time = att[s.id]?.time || "-";
   if(status==="Present") present++;
   let badge = status==="Present"?`<span class="badge yes">${status} ${time}</span>`:`<span class="badge no">${status}</span>`;
   list.innerHTML+=`<tr><td><b>${s.name}</b><br><small>${s.id} | ${s.year} | ${s.course}</small></td><td>${badge}</td><td><div class="row"><button class="small presentBtn" onclick="setStatus('${s.id}','Present')">✓</button><button class="small absentBtn" onclick="setStatus('${s.id}','Absent')">✕</button></div></td></tr>`;
 });
 pCount.innerText="Present: "+present;
 aCount.innerText="Absent: "+(roster.length-present);
 tCount.innerText="Total: "+roster.length;
}

function setStatus(id,status){
 att[id]={status:status, time: status==="Present"? new Date().toLocaleTimeString() : "-"};
 saveAtt(); render();
}

function resetDay(){
 if(confirm("Reset all to Absent for today?")){
   att={}; roster.forEach(s=>{att[s.id]={status:"Absent", time:"-"}}); saveAtt(); render();
 }
}
function clearRoster(){
 if(confirm("Delete ALL students forever?")){
   roster=[]; att={}; saveRoster(); saveAtt(); render();
 }
}
function downloadCSV(){
 let csv="Date,"+new Date().toDateString()+"\nID,Name,Year,Module,Status,Time\n";
 roster.forEach(s=>{
   let a=att[s.id]||{status:"Absent",time:"-"};
   csv+=`${s.id},${s.name},${s.year},${s.course},${a.status},${a.time}\n`;
 });
 let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download="Imatt_"+new Date().toDateString()+".csv";a.click();
}
</script>
</body>
</html>
