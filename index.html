<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMATT College</title>
<style>
body{font-family:Arial;background:#0f4c3a;margin:0;padding:10px}
.card{background:#fff;border-radius:14px;padding:14px;max-width:750px;margin:10px auto}
.header{text-align:center}.header h2{margin:6px 0;color:#0f4c3a}
.motto{color:#8b0000;font-size:11px;font-weight:bold;font-style:italic}
.yearMenu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.yearBtn{padding:22px;border:none;border-radius:12px;color:#fff;font-weight:bold;font-size:14px}
.y1{background:#1e40af}.y2{background:#059669}.y3{background:#d97706}.y4{background:#7c3aed}
input,select{width:100%;padding:11px;margin:5px 0;border-radius:8px;border:1px solid #ddd;box-sizing:border-box}
button.main{width:100%;padding:11px;border:none;border-radius:8px;background:#0f4c3a;color:#fff;font-weight:bold;margin-top:6px}
.count{display:flex;justify-content:space-around;background:#ecfdf5;padding:10px;border-radius:10px;font-weight:bold;margin:10px 0;border:1px solid #d1fae5}
.page{display:none}.page.active{display:block}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:center}th{background:#0f4c3a;color:#fff}.wrap{overflow-x:auto}
.editBtn{background:#fef3c7;border:1px dashed #d97706;padding:4px 8px;border-radius:6px;cursor:pointer}
.statusBtn{border:none;padding:6px 12px;border-radius:20px;font-weight:bold;cursor:pointer;color:#fff}
.present{background:#16a34a}.absent{background:#dc2626}
</style>
</head>
<body>
<div class="card">
<div class="header"><h2>IMATT COLLEGE</h2><div class="motto">Education is the Source of Human Progress</div></div>

<div id="home" class="page active">
<div style="text-align:center;font-weight:bold;margin:14px 0">SELECT YEAR - Each Year Sees Only Their Own</div>
<div class="yearMenu">
<button class="yearBtn y1" onclick="openY('Year 1')">🎓<br>Year 1</button>
<button class="yearBtn y2" onclick="openY('Year 2')">📚<br>Year 2</button>
<button class="yearBtn y3" onclick="openY('Year 3')">📖<br>Year 3</button>
<button class="yearBtn y4" onclick="openY('Year 4')">👨‍🎓<br>Final Year</button>
</div>
<button class="main" style="background:#111827" onclick="openY('All')">🔐 Admin - View All Years</button>
<div style="text-align:center;margin-top:14px;font-size:12px;color:#555">Design by Issa Koroma - Year 2 2026</div>
</div>

<div id="att" class="page">
<button class="main" style="width:auto;background:#6b7280" onclick="goHome()">← Back</button>
<div id="tYear" style="text-align:center;font-weight:bold;margin:10px 0;color:#0f4c3a;font-size:18px"></div>
<input id="sid" placeholder="Student ID"><input id="sname" placeholder="Full Name"><input id="ccourse" placeholder="Module"><select id="sstat"><option>Present</option><option>Absent</option></select>
<button class="main" onclick="add()">✅ Mark Attendance</button><button class="main" style="background:#16a34a" onclick="exp()">📊 Export Excel</button>
<div class="count"><div>Present<br><span id="pC">0</span></div><div>Absent<br><span id="aC">0</span></div><div>Total<br><span id="tC">0</span></div></div>
<div style="font-size:11px;color:#666;text-align:center">Tap Module to edit, Tap Status to change Present/Absent + Time updates</div>
<div class="wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Module</th><th>Status</th><th>Time</th><th>X</th></tr></thead><tbody id="list"></tbody></table></div>
</div>
</div>

<script>
let all=JSON.parse(localStorage.getItem('imatt_final')||'null');
if(!all) all={'Year 1':[],'Year 2':[],'Year 3':[],'Year 4':[]};
let cur='Year 1';
function openY(y){cur=y;home.classList.remove('active');att.classList.add('active');tYear.innerText=y==='All'?'All Years':y;render();}
function goHome(){att.classList.remove('active');home.classList.add('active');}
function save(){localStorage.setItem('imatt_final',JSON.stringify(all));}
function add(){
 let id=document.getElementById('sid').value.trim();
 let name=document.getElementById('sname').value.trim();
 let mod=document.getElementById('ccourse').value.trim();
 let st=document.getElementById('sstat').value;
 if(!id||!name||!mod){alert('Fill all');return}
 let target=cur==='All'?'Year 2':cur;
 if(target==='Year 4') target='Year 4';
 if(!all[target]) target='Year 2';
 all[target].unshift({id:id,name:name,module:mod,stat:st,time:new Date().toLocaleTimeString(),date:new Date().toLocaleDateString()});
 save();render();
 document.getElementById('sid').value='';document.getElementById('sname').value='';document.getElementById('ccourse').value='';
}
function toggleStat(y,i){
 let r=all[y][i];
 r.stat = r.stat==='Present'?'Absent':'Present';
 r.time=new Date().toLocaleTimeString();
 save();render();
}
function editMod(y,i){
 let old=all[y][i].module;
 let nm=prompt('Clear and type new Module:',old);
 if(nm===null) return;
 if(nm.trim()==='') return;
 all[y][i].module=nm.trim();
 all[y][i].time=new Date().toLocaleTimeString();
 save();render();
}
function del(y,i){if(confirm('Delete?')){all[y].splice(i,1);save();render();}}
function render(){
 list.innerHTML='';let p=0,a=0,t=0;
 let years=cur==='All'?Object.keys(all):[cur];
 years.forEach(y=>{
  all[y].forEach((s,i)=>{
   if(s.stat==='Present')p++;else a++;t++;
   list.innerHTML+=`<tr><td>${s.id}</td><td style="text-align:left">${s.name}</td><td><span class="editBtn" onclick="editMod('${y}',${i})">${s.module}</span></td><td><button class="statusBtn ${s.stat==='Present'?'present':'absent'}" onclick="toggleStat('${y}',${i})">${s.stat}</button></td><td>${s.time}</td><td><button onclick="del('${y}',${i})" style="background:red;color:#fff;border:none;padding:4px 8px;border-radius:4px">X</button></td></tr>`;
  });
 });
 pC.innerText=p;aC.innerText=a;tC.innerText=t;
}
function exp(){let csv="Year,ID,Name,Module,Status,Time\n";let years=cur==='All'?Object.keys(all):[cur];years.forEach(y=>{all[y].forEach(s=>{csv+=`"${y}","${s.id}","${s.name}","${s.module}","${s.stat}","${s.time}"\n`;});});let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download="IMATT_"+cur+".csv";a.click();}
render();
</script>
</body>
</html>
