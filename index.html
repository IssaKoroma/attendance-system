<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMATT COLLEGE - Final</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#0b3d2e;color:#fff}
.header{text-align:center;padding:15px;background:#0b3d2e;position:sticky;top:0;z-index:20}
.card{background:#fff;color:#000;border-radius:14px;padding:12px;margin:10px}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:9px;border:1.5px solid #ccc}
button{font-weight:bold;cursor:pointer}
.btn-dark{background:#0b3d2e;color:#fff}
.btn-green{background:#0f6d4a;color:#fff}
.btn-blue{background:#0d4a8a;color:#fff}
.year-btn,.role-btn{width:auto;display:inline-block;padding:8px 14px;margin:3px;border-radius:20px;border:2px solid #000;background:#fff;color:#000}
.active{background:#0b3d2e!important;color:#fff!important}
table{width:100%;border-collapse:collapse;background:#fff;color:#000;font-size:13px}
th{background:#0b3d2e;color:#fff;padding:8px}
td{border:2px solid #000;padding:6px;text-align:center}
.present{background:#d1fae5;color:#065f46;border-radius:20px;border:none;padding:6px 12px}
.absent{background:#fee2e2;color:#991b1b;border-radius:20px;border:none;padding:6px 12px}
.module-cell{background:#fffbe6;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h1>IMATT COLLEGE</h1><p id="datetime"></p><p id="deptLabel">Computer Science Y2</p></div>

<div class="card">
<input id="deptInput" list="deptList" value="Computer Science">
<datalist id="deptList"><option value="Computer Science"><option value="Banking & Finance"><option value="Business Administration"></datalist>
<div>
<button class="year-btn" id="yAll" onclick="setYear('ALL')">ALL</button>
<button class="year-btn" id="y1" onclick="setYear('Y1')">Y1</button>
<button class="year-btn active" id="y2" onclick="setYear('Y2')">Y2</button>
<button class="year-btn" id="y3" onclick="setYear('Y3')">Y3</button>
<button class="year-btn" id="y4" onclick="setYear('Y4')">Y4</button>
</div>
<div>
<button class="role-btn" id="r1" onclick="showLogin('LECTURER')">LECTURER</button>
<button class="role-btn" id="r2" onclick="showLogin('CLASS REP')">CLASS REP</button>
<button class="role-btn active" id="r3" onclick="showLogin('ADMIN')">ADMIN</button>
</div>
</div>

<div class="card" id="loginArea"><b id="loginTitle">ADMIN Login</b><br><input type="password" id="passInput" placeholder="Password"><button class="btn-dark" onclick="login()">Login</button><small>lecturer123 | rep123 | admin123</small></div>
<div class="card" id="loggedArea" style="display:none"><span id="loggedText"></span><button onclick="logout()" style="width:auto;float:right">Logout</button><div style="clear:both"></div></div>

<div class="card" id="adminPanel" style="display:none">
<b>Add Student</b>
<select id="sYear"><option>Y1</option><option selected>Y2</option><option>Y3</option><option>Y4</option></select>
<input id="sName" placeholder="Name e.g Issa Koroma">
<input id="sID" placeholder="ID e.g 1727">
<input id="sModule" list="modList" placeholder="Type Module e.g Networking" value="Networking">
<datalist id="modList"><option value="Networking"><option value="Operating System"><option value="Database"><option value="Programming"><option value="Cyber Security"></datalist>
<button class="btn-dark" onclick="addStudent()">+ Add Student</button>
<button class="btn-green" onclick="downloadExcel()">📥 Download Excel (Data stays)</button>
<button class="btn-blue" onclick="downloadPhone()">📱 Download Phone</button>
<p>Present: <span id="pcount">0</span> | Total: <span id="tcount">0</span> | View: <span id="viewLabel">Y2 Only</span></p>
</div>

<div class="card" style="overflow-x:auto">
<table><thead><tr><th>Year</th><th>Name</th><th>ID</th><th>Module (Click to Edit)</th><th>Status</th><th>Date/Time</th></tr></thead><tbody id="tbody"></tbody></table>
</div>

<script>
// ===== CONFIGURE FIREBASE FOR PHONE SYNC =====
// 1. Go to firebase.google.com > Create Project > Realtime Database > Create
// 2. Copy config here. If you leave it empty, it will use local phone only.
const firebaseConfig = {
  apiKey: "REPLACE_WITH_YOURS",
  authDomain: "REPLACE.firebaseapp.com",
  databaseURL: "https://REPLACE-default-rtdb.firebaseio.com",
  projectId: "REPLACE",
  storageBucket: "REPLACE.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abc"
};
let useFirebase = false;
try{
 if(firebaseConfig.apiKey.indexOf("REPLACE")==-1){
   firebase.initializeApp(firebaseConfig);
   useFirebase=true;
 }
}catch(e){useFirebase=false;}

let currentDept="Computer Science", currentYearView="Y2", currentRole="ADMIN", loggedIn=false;
const PASSWORDS={"LECTURER":"lecturer123","CLASS REP":"rep123","ADMIN":"admin123"};
function updateTime(){document.getElementById('datetime').innerText=new Date().toLocaleString()+" - "+currentDept+" "+currentYearView;}
setInterval(updateTime,1000);
document.getElementById('deptInput').addEventListener('input',e=>{currentDept=e.target.value||"Computer Science";refresh();loadTable();});
function setYear(y){currentYearView=y;document.querySelectorAll('.year-btn').forEach(b=>b.classList.remove('active'));document.getElementById('y'+y.toLowerCase()).classList.add('active');if(y=="ALL")document.getElementById('yall').classList.add('active');refresh();loadTable();}
function refresh(){document.getElementById('deptLabel').innerText=currentDept+" "+currentYearView;document.getElementById('viewLabel').innerText=currentYearView=="ALL"?"All Years":currentYearView+" Only";document.getElementById('loginTitle').innerText=currentRole+" Login - "+currentDept+" "+currentYearView;}
function showLogin(r){currentRole=r;document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));if(r=="LECTURER")document.getElementById('r1').classList.add('active');if(r=="CLASS REP")document.getElementById('r2').classList.add('active');if(r=="ADMIN")document.getElementById('r3').classList.add('active');refresh();}
function login(){if(document.getElementById('passInput').value===PASSWORDS[currentRole]){loggedIn=true;document.getElementById('loginArea').style.display="none";document.getElementById('loggedArea').style.display="block";document.getElementById('adminPanel').style.display="block";document.getElementById('loggedText').innerText="Logged as "+currentRole+" - "+currentDept;loadTable();}else alert("Wrong password");}
function logout(){loggedIn=false;document.getElementById('loggedArea').style.display="none";document.getElementById('adminPanel').style.display="none";document.getElementById('loginArea').style.display="block";}

function getKey(){return "IMATT_"+currentDept.replace(/[^a-zA-Z0-9]/g,"_");}

function getStudentsLocal(){return JSON.parse(localStorage.getItem(getKey())||"[]");}
function saveStudentsLocal(a){localStorage.setItem(getKey(),JSON.stringify(a));}

function loadTable(){
 if(useFirebase){
   firebase.database().ref(getKey()).on('value',snap=>{
     let data=snap.val(); let arr=data?Object.values(data):[];
     renderTable(arr);
   });
 }else{
   renderTable(getStudentsLocal());
 }
}
function renderTable(allArr){
 let tbody=document.getElementById('tbody');tbody.innerHTML="";
 let filtered = currentYearView=="ALL"? allArr : allArr.filter(s=>s.year==currentYearView);
 let present=0;
 filtered.forEach((s,i)=>{
   if(s.status=="Present")present++;
   let realIndex = allArr.indexOf(s);
   let tr=document.createElement('tr');
   tr.innerHTML=`<td><b>${s.year}</b></td><td><b>${s.name}</b></td><td>${s.id}</td><td class="module-cell" onclick="editModule(${realIndex})"><b>${s.module}</b><br><small>✏️ click to change</small></td><td><button class="${s.status=='Present'?'present':'absent'}" onclick="toggleStatus(${realIndex})">${s.status}</button></td><td style="font-size:10px">${s.date}</td>`;
   tbody.appendChild(tr);
 });
 document.getElementById('pcount').innerText=present;
 document.getElementById('tcount').innerText=filtered.length;
}

function addStudent(){
 if(!loggedIn)return alert("Login first");
 let name=document.getElementById('sName').value.trim(),id=document.getElementById('sID').value.trim(),year=document.getElementById('sYear').value,mod=document.getElementById('sModule').value.trim();
 if(!name||!id||!mod)return alert("Write all");
 let obj={year:year,name:name,id:id,module:mod,status:"Absent",date:new Date().toLocaleString()+" by "+currentRole};
 if(useFirebase){firebase.database().ref(getKey()).push(obj);}else{let arr=getStudentsLocal();arr.push(obj);saveStudentsLocal(arr);loadTable();}
 document.getElementById('sName').value="";document.getElementById('sID').value="";
}
function editModule(realIndex){
 if(!loggedIn)return alert("Login first");
 let arr = getStudentsLocal(); // for prompt get current even if firebase, we get from rendered? simpler: get from firebase list handled in callback
 if(useFirebase){
   firebase.database().ref(getKey()).once('value',snap=>{
     let data=snap.val(); let keys=Object.keys(data); let vals=Object.values(data);
     let newMod=prompt("Edit Module for "+vals[realIndex].name+" Current: "+vals[realIndex].module, vals[realIndex].module);
     if(newMod){firebase.database().ref(getKey()+"/"+keys[realIndex]+"/module").set(newMod.trim());firebase.database().ref(getKey()+"/"+keys[realIndex]+"/date").set(new Date().toLocaleString()+" - Module to "+newMod+" by "+currentRole);}
   });
 }else{
   let arr=getStudentsLocal(); let newMod=prompt("Edit Module for "+arr[realIndex].name, arr[realIndex].module);
   if(newMod){arr[realIndex].module=newMod.trim();arr[realIndex].date=new Date().toLocaleString()+" - Module to "+newMod+" by "+currentRole;saveStudentsLocal(arr);loadTable();}
 }
}
function toggleStatus(realIndex){
 if(!loggedIn)return alert("Login first");
 if(useFirebase){
   firebase.database().ref(getKey()).once('value',snap=>{
     let data=snap.val(); let keys=Object.keys(data); let vals=Object.values(data);
     let newStatus=vals[realIndex].status=="Present"?"Absent":"Present";
     firebase.database().ref(getKey()+"/"+keys[realIndex]+"/status").set(newStatus);
     firebase.database().ref(getKey()+"/"+keys[realIndex]+"/date").set(new Date().toLocaleString()+" - Marked "+newStatus+" by "+currentRole);
   });
 }else{
   let arr=getStudentsLocal();arr[realIndex].status=arr[realIndex].status=="Present"?"Absent":"Present";arr[realIndex].date=new Date().toLocaleString()+" - Marked "+arr[realIndex].status+" by "+currentRole;saveStudentsLocal(arr);loadTable();
 }
}
function downloadExcel(){let arr=getStudentsLocal();if(useFirebase){alert("For Firebase, data will download from table view - please wait then download");} // simplified
 let tbody=document.getElementById('tbody'); // use current filtered
 let data=[["Dept","Year","Name","ID","Module","Status","Date"]];
 let rows=document.querySelectorAll('#tbody tr');rows.forEach(r=>{let cols=r.querySelectorAll('td');data.push([currentDept,cols[0].innerText,cols[1].innerText,cols[2].innerText,cols[3].innerText.split('\n')[0],cols[4].innerText,cols[5].innerText]);});
 let ws=XLSX.utils.aoa_to_sheet(data);ws['!cols']=[{wch:20},{wch:6},{wch:20},{wch:10},{wch:25},{wch:12},{wch:35}];let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Att");XLSX.writeFile(wb,currentDept+"_"+currentYearView+"_Attendance.xlsx");
}
function downloadPhone(){let csv="Dept,Year,Name,ID,Module,Status,Date\n";let rows=document.querySelectorAll('#tbody tr');rows.forEach(r=>{let cols=r.querySelectorAll('td');csv+=`"${currentDept}","${cols[0].innerText}","${cols[1].innerText}","${cols[2].innerText}","${cols[3].innerText.split('\n')[0]}","${cols[4].innerText}","${cols[5].innerText}"\n`;});let blob=new Blob([csv],{type:"text/csv"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=currentDept+"_"+currentYearView+".csv";a.click();}

refresh();loadTable();updateTime();
</script>
</body>
</html>
