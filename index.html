<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMATT COLLEGE - Attendance</title>
<style>
body{background:#0a3d2e;font-family:Arial;margin:0;padding:10px}
.card{background:white;max-width:520px;margin:auto;border-radius:18px;padding:18px}
h1{color:#0a3d2e;text-align:center;margin:5px}
.sub{color:#8b0000;text-align:center;font-style:italic;font-weight:bold;font-size:13px}
.badge{background:#8b0000;color:white;padding:6px 14px;border-radius:20px;display:block;width:fit-content;margin:8px auto;font-size:11px}
.btn-back{background:#6c757d;color:white;border:none;padding:10px 15px;border-radius:20px;font-weight:bold}
.dept-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dept-btn{border:2px solid #0a3d2e;padding:13px;border-radius:12px;background:white;font-weight:bold;color:#0a3d2e}
.year-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.year-btn{padding:18px;border-radius:14px;border:none;color:white;font-weight:bold}
.y1{background:#1e3a8a}.y2{background:#0e9f6e}.y3{background:#d97706}.y4{background:#7c3aed}
input{width:100%;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #bbb;box-sizing:border-box}
button.main{background:#0a3d2e;color:white;padding:12px;border:none;border-radius:9px;font-weight:bold;width:100%;margin-top:6px}
.hidden{display:none}
.teacher-box{background:#e8f8f5;border:2px solid #0a3d2e;padding:12px;border-radius:10px;margin:12px 0}
.lock-box{background:#fff3cd;border:2px solid #ff9800;padding:10px;border-radius:10px;text-align:center;font-weight:bold;color:#856404;margin:8px 0}
.receipt{background:#d1fae5;border:2px solid #0e9f6e;padding:14px;border-radius:12px;margin-top:12px}
.student-info-box{background:#eef2ff;border:1px solid #6366f1;padding:10px;border-radius:10px;margin:8px 0;font-size:13px}
#todayCode{font-size:28px;color:red;font-weight:bold}
#timer{color:red;font-weight:bold}
.small{font-size:11px;color:gray;text-align:center}
</style>
</head>
<body>
<div class="card">
<h1>IMATT COLLEGE</h1>
<div class="sub">Education is the Source of Human Progress</div>
<div class="badge" id="dateDisplay"></div>

<div id="teacherLogin" style="background:#f1f1f1;padding:8px;border-radius:8px">
<input type="password" id="teacherPass" placeholder="Lecturer Password (Students skip)">
<button class="main" onclick="teacherLogin()" style="background:#444">Login as Lecturer</button>
</div>

<div id="teacherPanel" class="hidden">
<div class="teacher-box">
<p style="text-align:center"><b>LECTURER MODE: <span id="teachingInfo"></span></b></p>
<input type="text" id="moduleInput" placeholder="Enter Module e.g. Database Management">
<p>Code: <span id="todayCode">Not Generated</span><br>Time Left: <span id="timer">--:--</span></p>
<button class="main" onclick="generateCode()">Generate Code For This Class (15 Min)</button>
<p>Present: <b id="presentCount">0</b></p>
<div id="todayList" style="font-size:13px"></div>
<button class="main" onclick="exportExcel()" style="background:#27ae60">Download Excel</button>
<button class="main" onclick="teacherLogout()" style="background:gray">Logout Lecturer</button>
</div>
</div>

<div id="stepDept">
<h2 style="text-align:center">SELECT DEPARTMENT</h2>
<div class="dept-grid">
<button class="dept-btn" onclick="selectDept('Law (LLB)')">Law (LLB)</button>
<button class="dept-btn" onclick="selectDept('Information Systems')">Information Systems</button>
<button class="dept-btn" onclick="selectDept('Business Administration')">Business Administration</button>
<button class="dept-btn" onclick="selectDept('Applied Accounting')">Applied Accounting</button>
<button class="dept-btn" onclick="selectDept('Human Resource Mgt')">Human Resource Mgt</button>
<button class="dept-btn" onclick="selectDept('Procurement & Supply')">Procurement & Supply</button>
<button class="dept-btn" onclick="selectDept('Nursing (SRN)')">Nursing (SRN)</button>
<button class="dept-btn" onclick="selectDept('Computer Science')">Computer Science</button>
</div>
<div id="studentLockInfo"></div>
</div>

<div id="stepYear" class="hidden">
<button class="btn-back" onclick="backToDept()">← Back to Departments</button>
<div style="background:#e6f4ea;padding:10px;border-radius:8px;text-align:center;margin:10px 0;font-weight:bold" id="deptNameShow"></div>
<h2 style="text-align:center">SELECT YEAR</h2>
<div id="yearLockWarning"></div>
<div class="year-grid">
<button class="year-btn y1" id="btnY1" onclick="selectYear('Year 1')">Year 1</button>
<button class="year-btn y2" id="btnY2" onclick="selectYear('Year 2')">Year 2</button>
<button class="year-btn y3" id="btnY3" onclick="selectYear('Year 3')">Year 3</button>
<button class="year-btn y4" id="btnY4" onclick="selectYear('Final Year')">Final Year</button>
</div>
</div>

<div id="stepAttendance" class="hidden">
<button class="btn-back" onclick="backToYear()">← Back to Years</button>
<h3 style="text-align:center"><span id="finalDept"></span> - <span id="finalYear"></span></h3>

<!-- STUDENT SEES MODULE, DATE, TIME BEFORE MARKING -->
<div class="student-info-box" id="studentTopInfo">
Module: <b id="showModuleStudent">Not set by Lecturer yet</b><br>
Date: <b id="showDateStudent"></b><br>
Time: <b id="showTimeStudent"></b>
</div>

<div id="studentForm">
<input type="text" id="stuID" placeholder="Student ID e.g. 1727">
<input type="text" id="stuName" placeholder="Full Name e.g. Issa Koroma">
<input type="text" id="secretCodeInput" placeholder="Enter Code from Board">
<button class="main" id="markBtn" onclick="markAttendance()">Mark Present</button>
<p id="message" style="text-align:center;font-weight:bold"></p>
<div id="receiptBox"></div>
</div>
</div>
</div>

<script>
const TEACHER_PASSWORD="imatt2026"; const DURATION=15;
let selectedDept="", selectedYear="", timerInterval=null;

function updateDateTime(){
 let now=new Date();
 document.getElementById('dateDisplay').innerText=now.toLocaleString('en-GB');
 let d=document.getElementById('showDateStudent'); if(d) d.innerText=now.toLocaleDateString('en-GB');
 let t=document.getElementById('showTimeStudent'); if(t) t.innerText=now.toLocaleTimeString();
}
setInterval(updateDateTime,1000); updateDateTime();
function getProfile(){return JSON.parse(localStorage.getItem('imatt_student_profile')||'null');}
function getKey(type){return type+'_'+selectedDept+'_'+selectedYear;}

function teacherLogin(){
 if(document.getElementById('teacherPass').value===TEACHER_PASSWORD){
  localStorage.setItem('imatt_teacher_logged','yes');
  document.getElementById('teacherLogin').classList.add('hidden');
  document.getElementById('teacherPanel').classList.remove('hidden');
  showCode(); startTimer(); updateCounts();
 } else alert('Wrong Password');
}
function teacherLogout(){localStorage.removeItem('imatt_teacher_logged'); location.reload();}

function selectDept(d){
 let p=getProfile();
 if(p && p.dept!==d && localStorage.getItem('imatt_teacher_logged')!=='yes'){alert('❌ Phone locked to '+p.dept); return;}
 selectedDept=d;
 document.getElementById('stepDept').classList.add('hidden');
 document.getElementById('stepYear').classList.remove('hidden');
 document.getElementById('deptNameShow').innerText=d;
 checkYearLock();
}
function backToDept(){document.getElementById('stepYear').classList.add('hidden'); document.getElementById('stepDept').classList.remove('hidden');}
function checkYearLock(){
 let p=getProfile();
 let w=document.getElementById('yearLockWarning');
 if(p && localStorage.getItem('imatt_teacher_logged')!=='yes'){
   w.innerHTML='<div class="lock-box">🔒 Locked to: '+p.dept+' '+p.year+'</div>';
 } else w.innerHTML='';
}
function selectYear(y){
 let p=getProfile();
 if(p && localStorage.getItem('imatt_teacher_logged')!=='yes'){
   if(p.year!==y || p.dept!==selectedDept){alert('❌ You are locked to '+p.dept+' '+p.year); return;}
 }
 selectedYear=y;
 document.getElementById('stepYear').classList.add('hidden');
 document.getElementById('stepAttendance').classList.remove('hidden');
 document.getElementById('finalDept').innerText=selectedDept;
 document.getElementById('finalYear').innerText=selectedYear;
 document.getElementById('teachingInfo').innerText=selectedDept+' '+selectedYear;
 if(p){document.getElementById('stuID').value=p.id; document.getElementById('stuName').value=p.name;}
 showCode(); startTimer(); updateCounts();
}

function backToYear(){document.getElementById('stepAttendance').classList.add('hidden'); document.getElementById('stepYear').classList.remove('hidden');}

function generateCode(){
 let mod=document.getElementById('moduleInput').value.trim();
 if(!mod){alert('Enter Module First!'); return;}
 let code='IMATT-'+Math.random().toString(36).substring(2,6).toUpperCase();
 let expiry=Date.now()+DURATION*60*1000;
 localStorage.setItem(getKey('imatt_code'),code);
 localStorage.setItem(getKey('imatt_expiry'),expiry);
 localStorage.setItem(getKey('imatt_module'),mod);
 document.getElementById('todayCode').innerText=code;
 // FIX reopen
 document.getElementById('markBtn').disabled=false;
 document.getElementById('markBtn').innerText='Mark Present';
 document.getElementById('markBtn').style.background='#0a3d2e';
 let today=new Date().toISOString().split('T')[0];
 localStorage.removeItem('phone_'+today+'_'+selectedDept+'_'+selectedYear);
 alert('Module: '+mod+'\nCode: '+code+'\nFor: '+selectedDept+' '+selectedYear);
 showCode(); startTimer(); updateCounts();
}

function showCode(){
 if(!selectedDept||!selectedYear) return;
 let c=localStorage.getItem(getKey('imatt_code'));
 let m=localStorage.getItem(getKey('imatt_module'));
 document.getElementById('todayCode').innerText=c?c:'Not Generated';
 document.getElementById('showModuleStudent').innerText=m?m:'Not set by Lecturer yet';
}
function startTimer(){
 if(timerInterval) clearInterval(timerInterval);
 timerInterval=setInterval(()=>{
  if(!selectedDept||!selectedYear) return;
  let exp=localStorage.getItem(getKey('imatt_expiry'));
  if(!exp){document.getElementById('timer').innerText='--:--'; return;}
  let diff=exp-Date.now();
  if(diff<=0){
   document.getElementById('timer').innerText='CLOSED';
   document.getElementById('markBtn').disabled=true;
   document.getElementById('markBtn').innerText='⛔ Closed';
   document.getElementById('markBtn').style.background='red';
  } else {
   let m=Math.floor(diff/60000), s=Math.floor((diff%60000)/1000);
   document.getElementById('timer').innerText=m+':'+(s<10?'0':'')+s;
   document.getElementById('markBtn').disabled=false;
   document.getElementById('markBtn').innerText='Mark Present';
   document.getElementById('markBtn').style.background='#0a3d2e';
  }
 },1000);
}

function markAttendance(){
 let exp=localStorage.getItem(getKey('imatt_expiry'));
 if(!exp){alert('Lecturer not started'); return;}
 if(Date.now()>exp){alert('Closed'); return;}
 let id=document.getElementById('stuID').value.trim();
 let name=document.getElementById('stuName').value.trim();
 let entered=document.getElementById('secretCodeInput').value.trim().toUpperCase();
 let real=localStorage.getItem(getKey('imatt_code'));
 let module=localStorage.getItem(getKey('imatt_module'))||'';
 let now=new Date(); let dateStr=now.toLocaleDateString('en-GB'); let timeStr=now.toLocaleTimeString(); let todayISO=now.toISOString().split('T')[0];
 if(!id||!name){alert('Enter ID and Name'); return;}
 if(entered!==real){alert('Wrong Code for '+selectedDept+' '+selectedYear); return;}

 let profile=getProfile();
 if(!profile){localStorage.setItem('imatt_student_profile',JSON.stringify({id:id,name:name,dept:selectedDept,year:selectedYear}));}
 else if(profile.dept!==selectedDept||profile.year!==selectedYear){alert('Locked to '+profile.dept+' '+profile.year); return;}

 let phoneKey='phone_'+todayISO+'_'+selectedDept+'_'+selectedYear;
 if(localStorage.getItem(phoneKey)){document.getElementById('message').innerText='❌ Already marked today'; return;}
 let key='records_'+selectedDept+'_'+selectedYear;
 let records=JSON.parse(localStorage.getItem(key)||'{}');
 if(!records[todayISO]) records[todayISO]={};
 if(records[todayISO][id]){document.getElementById('message').innerText='❌ Already marked'; return;}
 records[todayISO][id]={name:name, module:module, date:dateStr, time:timeStr, dept:selectedDept, year:selectedYear};
 localStorage.setItem(key,JSON.stringify(records));
 localStorage.setItem(phoneKey,name);

 // STUDENT RECEIPT - THIS IS WHAT YOU ASKED
 document.getElementById('message').innerText='✅ Present!';
 document.getElementById('receiptBox').innerHTML=`
 <div class="receipt">
 <b style="font-size:16px">✅ ATTENDANCE RECEIPT</b><br><br>
 ${name} ${id} opening system ${dateStr} ${timeStr} present for Today class<br><br>
 Department: <b>${selectedDept}</b><br>
 Year: <b>${selectedYear}</b><br>
 Module: <b>${module}</b><br>
 Date: <b>${dateStr}</b><br>
 Time: <b>${timeStr}</b><br>
 Status: <b style="color:green">Present ✔</b>
 </div>`;
 document.getElementById('secretCodeInput').value='';
 updateCounts();
}

function updateCounts(){
 if(!selectedDept||!selectedYear) return;
 let todayISO=new Date().toISOString().split('T')[0];
 let key='records_'+selectedDept+'_'+selectedYear;
 let records=JSON.parse(localStorage.getItem(key)||'{}');
 let data=records[todayISO]||{};
 document.getElementById('presentCount').innerText=Object.keys(data).length;
 let html=''; for(let id in data){html+=`<div>${id} - ${data[id].name} - ${data[id].module} - ${data[id].time}</div>`;}
 document.getElementById('todayList').innerHTML=html;
 let p=getProfile();
 if(p && localStorage.getItem('imatt_teacher_logged')!=='yes'){
   document.getElementById('studentLockInfo').innerHTML='<div class="lock-box">🔒 Locked: '+p.dept+' '+p.year+'<br>'+p.name+' ('+p.id+')</div>';
 }
}
function exportExcel(){
 let todayISO=new Date().toISOString().split('T')[0];
 let key='records_'+selectedDept+'_'+selectedYear;
 let records=JSON.parse(localStorage.getItem(key)||'{}');
 let data=records[todayISO]; if(!data){alert('No data'); return;}
 let csv='ID,Name,Dept,Year,Module,Date,Time,Status\n';
 for(let id in data){let r=data[id]; csv+=`${id},${r.name},${r.dept},${r.year},${r.module},${r.date},${r.time},Present\n`;}
 let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${selectedDept}_${selectedYear}_${todayISO}.csv`; a.click();
}
if(localStorage.getItem('imatt_teacher_logged')==='yes'){document.getElementById('teacherLogin').classList.add('hidden'); document.getElementById('teacherPanel').classList.remove('hidden');}
updateCounts();
</script>
</body>
</html>
