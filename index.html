<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMATT COLLEGE ATTENDANCE</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a3d24;min-height:100vh;padding:10px}
.header{text-align:center;color:white;padding:10px 0 5px;font-weight:bold;font-size:22px}
.top-card{background:#e6f4ea;border-radius:20px;display:flex;justify-content:space-around;padding:15px;margin:10px 0;text-align:center}
.top-card div{font-weight:bold}
.top-card span{display:block;font-size:22px;margin-top:3px}
.btn-dark{background:#0a3d24;border:3px solid white;color:white;width:100%;padding:14px;border-radius:15px;font-weight:bold;font-size:16px;margin:8px 0;cursor:pointer}
.code-box{background:#0a3d24;border:3px solid white;color:white;width:100%;padding:15px;border-radius:15px;font-weight:bold;font-size:40px;letter-spacing:8px;text-align:center;margin:8px 0}
.timer{text-align:center;color:#ff0000;font-weight:bold;font-size:18px;margin:5px 0}
.input-box{width:100%;padding:12px;border-radius:12px;border:2px solid #ccc;outline:none;font-size:14px;margin:5px 0}
.btn-green{background:#00c853;color:white;width:100%;padding:14px;border-radius:15px;font-weight:bold;font-size:16px;border:none;margin:8px 0;cursor:pointer}
.year-tabs{display:flex;gap:5px;margin:10px 0}
.year-tabs button{flex:1;padding:10px;border-radius:12px;border:2px solid #0a3d24;background:white;font-weight:bold;cursor:pointer}
.year-tabs button.active{background:#0a3d24;color:white}
.table-card{background:white;border-radius:15px;overflow:hidden;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#0a3d24;color:white;padding:8px 4px;font-size:11px}
td{padding:8px 4px;text-align:center;border-bottom:1px solid #eee}
.badge-present{background:#00c853;color:white;padding:4px 7px;border-radius:12px;font-weight:bold;font-size:11px}
.module-badge{background:#fff8c4;border:1px dashed #d4a017;padding:3px 6px;border-radius:8px;font-size:10px}
.del{color:red;font-weight:bold;cursor:pointer;font-size:16px}
.footer{text-align:center;color:white;padding:15px;font-weight:bold;font-size:14px;margin-top:10px}
.login-box{background:#e6f4ea;border-radius:20px;padding:20px;margin-top:30px;text-align:center;border:3px solid #0a3d24}
select.input-box{background:white}
</style>
</head>
<body>

<div id="loginView">
<div class="login-box">
<h2 style="color:#0a3d24;margin-bottom:15px">IMATT COLLEGE ATTENDANCE</h2>
<input id="passInput" class="input-box" placeholder="imatt2026 / issa1727" type="password">
<button class="btn-green" onclick="login()">LOGIN</button>
</div>
<div class="footer">Built and Design by Issa Koroma Year 2</div>
</div>

<div id="mainView" style="display:none">
<div class="header">IMATT COLLEGE ATTENDANCE</div>

<div class="top-card">
<div>Present<br><span id="presentCount">0</span></div>
<div>Absent<br><span id="absentCount">0</span></div>
<div>Total<br><span id="totalCount">200</span></div>
</div>

<button class="btn-dark" onclick="generateCode()">🔑 Generate Code - Only Lecturer & Admin Generate</button>
<div class="code-box" id="codeDisplay">----</div>
<div class="timer" id="timerDisplay">⏰ No Code Yet</div>

<select id="deptInput" class="input-box">
<option value="Computer Science">Computer Science</option>
<option value="Business">Business</option>
<option value="Engineering">Engineering</option>
<option value="IMATT">IMATT</option>
</select>

<div style="display:flex;gap:5px">
<select id="yearInput" class="input-box" style="flex:1">
<option value="Y1">Year 1</option>
<option value="Y2" selected>Year 2</option>
<option value="Y3">Year 3</option>
<option value="Y4">Year 4</option>
</select>
<input id="moduleInput" class="input-box" style="flex:1" placeholder="Module: Operating System">
</div>

<input id="whatsappInput" class="input-box" placeholder="Paste: Name, ID e.g. Ibriham Koroma, 1543">
<button id="importBtn" class="btn-green" onclick="importStudent()">📥 Import - Add to Lecturer List</button>

<div class="year-tabs">
<button id="btnALL" onclick="filterYear('ALL')" class="active">ALL</button>
<button id="btnY1" onclick="filterYear('Y1')">Y1</button>
<button id="btnY2" onclick="filterYear('Y2')">Y2</button>
<button id="btnY3" onclick="filterYear('Y3')">Y3</button>
<button id="btnY4" onclick="filterYear('Y4')">Y4</button>
</div>

<div class="table-card">
<table>
<thead><tr><th>Year</th><th>Name/ID/Dept</th><th>Module</th><th>Status/Date</th><th>Del</th></tr></thead>
<tbody id="attendanceBody"></tbody>
</table>
</div>

<button class="btn-green" onclick="downloadExcel()" style="margin-top:10px">📥 Download Excel</button>
<button class="btn-dark" style="background:#d32f2f;border-color:white" onclick="clearAll()">Clear ALL</button>
<div class="footer">Built and Design by Issa Koroma Year 2</div>
</div>

<script>
const ALL_STUDENTS=[];
ALL_STUDENTS.push({year:"Y2",dept:"Computer Science",name:"Ibriham Koroma",id:"1543"});
for(let i=1500;i<1699;i++){ if(i==1543) continue; if(ALL_STUDENTS.length>=200) break; ALL_STUDENTS.push({year:"Y2",dept:"Computer Science",name:"Student "+i,id:String(i)}); }

let currentCode="";let expiry=0;let timerInt=null;let role="lecturer";
let data=JSON.parse(localStorage.getItem("imatt_attendance")||"[]");
let selectedFilter="ALL";

function login(){
 let p=document.getElementById("passInput").value.trim();
 if(p==="issa1727"){role="admin";}
 else if(p==="imatt2026"){role="lecturer";}
 else{alert("Wrong Password!");return;}
 document.getElementById("loginView").style.display="none";
 document.getElementById("mainView").style.display="block";
 render();
}
function generateCode(){
 currentCode=Math.floor(1000+Math.random()*9000).toString();
 expiry=Date.now()+7*60*1000;
 localStorage.setItem("imatt_code",currentCode);localStorage.setItem("imatt_expiry",expiry);
 document.getElementById("codeDisplay").innerText=currentCode.split("").join(" ");
 startTimer();
}
function startTimer(){
 clearInterval(timerInt);
 timerInt=setInterval(()=>{
  let diff=expiry-Date.now();
  if(diff<=0){document.getElementById("timerDisplay").innerText="⏰ Code Expired";clearInterval(timerInt);return;}
  let m=Math.floor(diff/60000);let s=Math.floor((diff%60000)/1000);
  document.getElementById("timerDisplay").innerHTML=`⏰ ${m}m ${s}s - Code: ${currentCode}`;
 },1000);
}

function importStudent(){
 let txt=document.getElementById("whatsappInput").value.trim();
 let dept=document.getElementById("deptInput").value;
 let year=document.getElementById("yearInput").value;
 let module=document.getElementById("moduleInput").value.trim()||"Operating System";
 if(!txt){alert("Paste Name, ID");return;}
 let parts=txt.split(/[\n,]+/).map(x=>x.trim()).filter(x=>x);
 let name=parts[0]||"Unknown";let id=parts[1]||parts[0].split(" ").pop();
 id=String(id).replace(/\D/g,"");
 if(!id){alert("ID not found");return;}

 // 1. CHECK DUPLICATE ID ACROSS ALL YEARS - BLOCK IT
 let existing=data.find(x=>String(x.id)===String(id));
 if(existing){
  alert(`❌ ID ${id} already registered under ${existing.dept} ${existing.year}! Cannot register again in ${dept} ${year}. One ID = One Year only.`);
  return;
 }

 let now=new Date();
 let d=`${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
 let t=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

 data.push({year:year,dept:dept,name:name,id:id,module:module,date:d,time:t,status:"Present"});
 localStorage.setItem("imatt_attendance",JSON.stringify(data));
 document.getElementById("whatsappInput").value="";
 // auto switch filter to that year so user sees it
 filterYear(year);
}

function filterYear(y){
 selectedFilter=y;
 document.querySelectorAll(".year-tabs button").forEach(b=>b.classList.remove("active"));
 document.getElementById("btn"+y).classList.add("active");
 render();
}

function render(){
 let body=document.getElementById("attendanceBody");body.innerHTML="";
 // 2. FILTER BY YEAR - ONLY SHOW SELECTED YEAR
 let filtered=data;
 if(selectedFilter!=="ALL"){ filtered=data.filter(r=>r.year===selectedFilter); }

 filtered.forEach((r,i)=>{
  let realIndex=data.indexOf(r);
  body.innerHTML+=`<tr>
  <td>${r.year}</td>
  <td><b>${r.name}</b><br>${r.id}<br><small>${r.dept}</small></td>
  <td><span class="module-badge">${r.module}</span></td>
  <td><span class="badge-present">${r.status}</span><br>${r.date}<br>${r.time}</td>
  <td><span class="del" onclick="delRow(${realIndex})">❌</span></td>
  </tr>`;
 });
 document.getElementById("presentCount").innerText=filtered.length;
 document.getElementById("totalCount").innerText=ALL_STUDENTS.length;
 document.getElementById("absentCount").innerText=ALL_STUDENTS.length - data.length;
}

function delRow(i){if(confirm("Delete?")){data.splice(i,1);localStorage.setItem("imatt_attendance",JSON.stringify(data));render();}}
function clearAll(){if(confirm("Clear ALL?")){data=[];localStorage.setItem("imatt_attendance",JSON.stringify(data));render();}}

function downloadExcel(){
 if(data.length===0){alert("No data");return;}
 let presentSheet=[["Year","Department","Name","ID","Module","Status","Date","Time"]];
 let source=selectedFilter==="ALL"?data:data.filter(r=>r.year===selectedFilter);
 source.forEach(r=>{presentSheet.push([r.year,r.dept,r.name,r.id,r.module,r.status,r.date,r.time])});
 let presentIds=data.map(x=>String(x.id));
 let absentList=ALL_STUDENTS.filter(s=>!presentIds.includes(String(s.id)));
 let absentSheet=[["Year","Department","Name","ID","Status"]];
 absentList.forEach(s=>{absentSheet.push([s.year,s.dept||"Computer Science",s.name,s.id,"Absent"])});

 let wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(presentSheet),selectedFilter==="ALL"?"Present_ALL":`Present_${selectedFilter}`);
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(absentSheet),"Absent");
 XLSX.writeFile(wb,`IMATT_ATTENDANCE_${selectedFilter}_${new Date().toISOString().slice(0,10)}.xlsx`);
}
</script>
</body>
</html>
