<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMATT Attendance</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#0f4c2e;padding:8px}
.white{background:white;border-radius:16px;padding:14px;max-width:420px;margin:auto}
.inp{width:100%;padding:14px;border:1.5px solid #ddd;border-radius:12px;margin:6px 0;background:#f8f8f8;font-size:15px}
.btn1{background:#0f3d26;color:white;width:100%;padding:15px;border-radius:12px;font-weight:900;border:none;margin:6px 0;font-size:16px}
.btn2{background:#16a34a;color:white;width:100%;padding:15px;border-radius:12px;font-weight:900;border:none;margin:6px 0;font-size:16px}
.box{background:#e8f5e9;border-radius:14px;display:flex;justify-content:space-around;text-align:center;padding:14px;margin:12px 0}
.box b{font-size:22px}
.head{background:#0f3d26;color:white;display:grid;grid-template-columns:0.6fr 1.2fr 1fr 1.5fr 0.8fr;gap:4px;padding:12px;border-radius:12px 12px 0 0;font-size:13px;font-weight:800;text-align:center}
.row{background:#fff;border:1px solid #e5e7eb;border-top:none;padding:10px;display:grid;grid-template-columns:0.6fr 1.2fr 1fr 1.5fr 0.8fr;gap:4px;align-items:center;font-size:12px;text-align:center}
.mod{background:#fef3c7;border:1.5px dashed #d97706;padding:5px 6px;border-radius:8px;font-size:11px}
.st{padding:6px 8px;border-radius:15px;color:white;font-weight:800;font-size:11px}
.present{background:#16a34a}
.absent{background:#dc2626}
.del{color:red;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="white">
<h2 style="text-align:center;color:#0f3d26">Computer Science - Year <span id="yrT">2</span></h2>

<input class="inp" id="sid" placeholder="Student ID e.g. 1727">
<input class="inp" id="sname" placeholder="Full Name">
<input class="inp" id="smod" placeholder="Module e.g. Operating System" value="operating system">
<select class="inp" id="sstatus"><option>Present</option><option>Absent</option></select>

<button class="btn1" onclick="mark()">✔ Mark Attendance</button>
<button class="btn2" onclick="exportEx()">📊 Export Excel</button>

<!-- Present Absent Total - WHERE FIRST ARROW POINTS -->
<div class="box">
<div>Present<br><b id="pC">0</b></div>
<div>Absent<br><b id="aC">0</b></div>
<div>Total<br><b id="tC">0</b></div>
</div>

<!-- Year, Name, ID, Module, Status, Date, Time, Delete - WHERE SECOND ARROW POINTS -->
<div class="head">
<span>Year</span><span>Name/ID</span><span>Module</span><span>Status/Date/Time</span><span>Delete</span>
</div>
<div id="list"></div>

<p style="text-align:center;font-weight:800;margin-top:14px;font-size:13px">This website built and Design by Issa Koroma year 2 student<br>
<span style="font-size:11px;color:#16a34a" onclick="loadOnline(true)">🔄 REFRESH - See All 200 | Total: <span id="totAll">0</span></span></p>
</div>

<script>
let year=2, students=JSON.parse(localStorage.getItem('imatt_final_v3')||'[]');
let kvdb="https://kvdb.io/8J7x9y2a3b4c5d6e/imatt_att_v3";

function save(){localStorage.setItem('imatt_final_v3',JSON.stringify(students));fetch(kvdb,{method:'POST',body:JSON.stringify(students)}).catch(()=>{});}
function loadOnline(show){
 fetch(kvdb).then(r=>r.text()).then(t=>{
  try{let o=JSON.parse(t); if(Array.isArray(o)&&o.length>students.length){students=o; localStorage.setItem('imatt_final_v3',JSON.stringify(students));} }catch(e){}
  render(); if(show) alert('✅ '+students.length+' loaded');
 });
}
function mark(){
 let id=document.getElementById('sid').value.trim();
 let name=document.getElementById('sname').value.trim();
 let mod=document.getElementById('smod').value.trim()||'operating system';
 let status=document.getElementById('sstatus').value;
 if(!id||!name){alert('Enter ID and Full Name');return;}
 let now=new Date(); let date=now.toLocaleDateString(); let time=now.toLocaleTimeString();
 students.unshift({year,id,name,module:mod,status,date,time});
 document.getElementById('sid').value=''; document.getElementById('sname').value='';
 save(); render();
}
function render(){
 let f=students.filter(s=>s.year==year);
 document.getElementById('pC').textContent=f.filter(s=>s.status=='Present').length;
 document.getElementById('aC').textContent=f.filter(s=>s.status=='Absent').length;
 document.getElementById('tC').textContent=f.length;
 document.getElementById('totAll').textContent=students.length;
 let h='';
 f.forEach(s=>{
  let idx=students.indexOf(s);
  h+=`<div class="row">
   <span><b>Y${s.year}</b></span>
   <span><b>${s.name}</b><br>${s.id}</span>
   <span><span class="mod">${s.module}</span></span>
   <span><span class="st ${s.status=='Present'?'present':'absent'}">${s.status}</span><br><span style="font-size:10px">${s.date}<br>${s.time}</span></span>
   <span class="del" onclick="del(${idx})">❌</span>
  </div>`;
 });
 document.getElementById('list').innerHTML=h||'<div style="text-align:center;padding:10px;color:gray">No records</div>';
}
function del(i){if(confirm('Delete '+students[i].name+'?')){students.splice(i,1); save(); render();}}
function exportEx(){
 let csv='Year,Name,ID,Module,Status,Date,Time\n';
 students.forEach(s=>{csv+=`${s.year},"${s.name}",${s.id},"${s.module}",${s.status},${s.date},${s.time}\n`;});
 let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob);
 a.download='IMATT_Year'+year+'_Attendance.csv'; a.click();
}
setInterval(()=>loadOnline(false),10000);
loadOnline(false); render();
</script>
</body>
</html>
